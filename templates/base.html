<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CNC Digital Twin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/isa101.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo-bk">
        <img src="/static/images/hust_logo.png" alt="ĐHBK Hà Nội" onerror="this.src='https://via.placeholder.com/55x55?text=HUST'">
        <div class="logo-bk-text">ĐH Bách Khoa<br>Hà Nội</div>
    </div>
    <div class="header-center">
        <div class="main-title">TÍNH TOÁN, THIẾT KẾ HỆ THỐNG ĐIỀU KHIỂN<br>MÁY CNC ĐỂ BÀN TỰ CHỦ THÔNG MINH</div>
        <div class="sub-title">GVHD: LÊ GIANG NAM</div>
    </div>
    <img src="/static/images/vimes_logo.png" alt="Vimes Lab" style="height:55px; width:auto;" onerror="this.src='https://via.placeholder.com/55x55?text=V'">
</header>

<!-- User badge -->
<div class="user-badge">
    <span class="user-dot"></span>
    <span>{{ username }}</span>
    <form action="/logout" method="POST" style="display:inline">
        <button class="logout-btn" type="submit">LOGOUT</button>
    </form>
</div>

<!-- MAIN CONTENT -->
<main class="content">
    <div class="home-wrapper">
        <div>
            <div class="home-title">SMART CNC DIGITAL TWIN</div>
            <div class="home-subtitle">HỆ THỐNG ĐIỀU KHIỂN THÔNG MINH</div>
        </div>

        <div class="menu-grid">
            <a class="menu-card" href="/control">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="10" y="18" width="52" height="36" rx="4" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <rect x="14" y="22" width="22" height="28" rx="2" fill="var(--cyan-glow)" stroke="var(--cyan-portal)" stroke-width="1.2"/>
                        <rect x="40" y="26" width="9" height="6" rx="1.5" fill="rgba(30,95,168,0.25)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="52" y="26" width="6" height="6" rx="1.5" fill="rgba(204,0,0,0.4)" stroke="var(--status-alarm)" stroke-width="1"/>
                        <rect x="40" y="35" width="9" height="6" rx="1.5" fill="rgba(30,95,168,0.15)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="52" y="35" width="6" height="6" rx="1.5" fill="rgba(30,95,168,0.15)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="40" y="44" width="18" height="4" rx="1.5" fill="rgba(255,204,0,0.25)" stroke="var(--status-warning)" stroke-width="1"/>
                        <circle cx="25" cy="36" r="7" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5"/>
                        <circle cx="25" cy="36" r="2.5" fill="var(--cyan-portal)"/>
                    </svg>
                </div>
                <div class="card-label">ĐIỀU KHIỂN</div>
            </a>

            <a class="menu-card" href="/monitor">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="8" y="12" width="56" height="38" rx="3" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <rect x="12" y="16" width="48" height="30" fill="rgba(30,95,168,0.06)"/>
                        <polyline points="14,38 20,32 26,35 32,24 38,28 44,20 50,26 56,22" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <polyline points="14,42 20,39 26,41 32,35 38,37 44,32 50,36 56,33" fill="none" stroke="var(--status-alarm)" stroke-width="1.5"/>
                        <line x1="36" y1="50" x2="36" y2="58" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <line x1="26" y1="58" x2="46" y2="58" stroke="var(--cyan-portal)" stroke-width="2"/>
                    </svg>
                </div>
                <div class="card-label">GIÁM SÁT</div>
            </a>

            <a class="menu-card" href="/settings">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <circle cx="36" cy="36" r="10" fill="none" stroke="var(--cyan-portal)" stroke-width="2.2"/>
                        <circle cx="36" cy="36" r="4" fill="rgba(30,95,168,0.3)"/>
                        <rect x="33" y="18" width="6" height="7" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="33" y="47" width="6" height="7" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="18" y="33" width="7" height="6" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="47" y="33" width="7" height="6" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                    </svg>
                </div>
                <div class="card-label">THÔNG SỐ</div>
            </a>
        </div>

        <div style="display:flex; gap:24px; align-items:center; margin-top:8px;">
            <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted);">
                <span style="width:8px; height:8px; border-radius:50%; background:var(--status-active); display:inline-block; animation:pulse 2s infinite;"></span>
                HỆ THỐNG HOẠT ĐỘNG
            </div>
            <div style="font-size:12px; color:var(--text-muted);" id="clockDisplay"></div>
        </div>
    </div>
</main>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="nav-link active" href="/">HOME</a>
    <a class="nav-link" href="/control">ĐIỀU KHIỂN</a>
    <a class="nav-link" href="/monitor">GIÁM SÁT</a>
    <a class="nav-link" href="/settings">THÔNG SỐ</a>
</nav>

<script>
// Clock
function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const d = now.toLocaleDateString('vi-VN');
    const el = document.getElementById('clockDisplay');
    if (el) el.textContent = '🕐 ' + t + '  |  ' + d;
}
setInterval(updateClock, 1000);
updateClock();

// Active nav highlight
const path = window.location.pathname;
document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.remove('active');
    const href = a.getAttribute('href');
    if (href === path || (path.startsWith(href) && href !== '/')) {
        a.classList.add('active');
    } else if (href === '/' && path === '/') {
        a.classList.add('active');
    }
});

// ========== LOAD THEME TỪ LOCALSTORAGE ==========
function loadThemeFromLocal() {
    const saved = localStorage.getItem('cnc_theme');
    if (saved) {
        try {
            const theme = JSON.parse(saved);
            const root = document.documentElement;
            if (theme.headerBg) root.style.setProperty('--gray-header', theme.headerBg); // ← đổi tên biến
            if (theme.cardBg)   root.style.setProperty('--gray-card', theme.cardBg);   
            if (theme.sidebarBg) root.style.setProperty('--gray-sidebar', theme.sidebarBg);
            if (theme.accentColor) root.style.setProperty('--cyan-portal', theme.accentColor);
            if (theme.borderColor) root.style.setProperty('--gray-border', theme.borderColor);
            if (theme.textColor) root.style.setProperty('--text-primary', theme.textColor);
            console.log('🎨 Theme loaded from localStorage');
        } catch(e) { console.error('Theme parse error:', e); }
    }
}

// Lắng nghe theme thay đổi từ tab khác
window.addEventListener('storage', (event) => {
    if (event.key === 'cnc_theme' && event.newValue) {
        try {
            const theme = JSON.parse(event.newValue);
            const root = document.documentElement;
            if (theme.headerBg) root.style.setProperty('--gray-card', theme.headerBg);
            if (theme.sidebarBg) root.style.setProperty('--gray-sidebar', theme.sidebarBg);
            if (theme.accentColor) root.style.setProperty('--cyan-portal', theme.accentColor);
            if (theme.borderColor) root.style.setProperty('--gray-border', theme.borderColor);
            if (theme.textColor) root.style.setProperty('--text-primary', theme.textColor);
            console.log('🎨 Theme updated from another tab');
        } catch(e) {}
    }
});

// Khởi tạo
loadThemeFromLocal();
</script>

</body>
</html>
