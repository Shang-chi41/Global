<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CNC Digital Twin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #c0392b;
            --gold:   #d4a017;
            --navy:   #0d1b2a;
            --steel:  #1e3a5f;
            --cyan:   #00c9d4;
            --light:  #e8f4f8;
            --white:  #ffffff;
            --border: rgba(0,201,212,0.25);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Be Vietnam Pro', sans-serif;
            background: var(--navy);
            min-height:100vh;
            display:flex; flex-direction:column;
            color:var(--white);
        }
        body::before {
            content:'';
            position:fixed; inset:0;
            background-image:
                linear-gradient(rgba(0,201,212,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,201,212,.04) 1px, transparent 1px);
            background-size:40px 40px;
            pointer-events:none; z-index:0;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--navy);
            border-bottom: 2px solid var(--gold);
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 88px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--cyan);
            opacity: .7;
        }

        .logo-bk { display: flex; align-items: center; gap: 10px; }
        .logo-bk-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .header-center { text-align: center; flex: 1; padding: 0 16px; }
        .header-center .main-title {
            font-weight: 700;
            font-size: 13px;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: .7px;
            line-height: 1.45;
        }
        .header-center .sub-title {
            font-size: 11px;
            color: var(--gold);
            margin-top: 4px;
            letter-spacing: .5px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--navy);
            border-top: 1px solid var(--border);
            display: flex;
            flex-shrink: 0;
            margin-top: auto;
        }
        .nav-link {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            font-family: 'Orbitron';
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #6b8fa8;
            text-decoration: none;
            text-transform: uppercase;
            border-top: 3px solid transparent;
            transition: .2s;
        }
        .nav-link:hover {
            color: var(--cyan);
            background: rgba(0,201,212,.05);
        }
        .nav-link.active {
            color: var(--red);
            border-top-color: var(--red);
            background: rgba(192,57,43,.05);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            position: relative;
            z-index: 1;
            padding: 32px 28px;
        }

        /* ===== HOME PAGE ===== */
        .home-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 88px - 50px);
            gap: 40px;
        }

        .home-title {
            font-family: 'Orbitron';
            font-size: 22px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 30px rgba(0,201,212,.4);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,100% { text-shadow: 0 0 20px rgba(0,201,212,.3); }
            50%      { text-shadow: 0 0 40px rgba(0,201,212,.7); }
        }
        .home-subtitle {
            font-size: 12px;
            color: #6b8fa8;
            letter-spacing: 3px;
            text-align: center;
            margin-top: -30px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 680px;
            width: 100%;
        }

        .menu-card {
            background: var(--steel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: .3s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(0,201,212,.05));
            opacity: 0;
            transition: .3s;
        }
        .menu-card:hover {
            border-color: var(--cyan);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,201,212,.15);
        }
        .menu-card:hover::before { opacity: 1; }
        .menu-card:hover .card-icon { transform: scale(1.1); filter: drop-shadow(0 0 12px var(--cyan)); }

        .card-icon { transition: .3s; }
        .card-label {
            font-family: 'Orbitron';
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--light);
            text-transform: uppercase;
        }

        .menu-card::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 12px;
            height: 12px;
            border-top: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
            opacity: 0;
            transition: .3s;
        }
        .menu-card:hover::after { opacity: 1; }

        /* ===== USER BADGE ===== */
        .user-badge {
            position: fixed;
            top: 100px;
            right: 20px;
            background: var(--steel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: #6b8fa8;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        .user-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00b894;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { opacity: .3 } }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(192,57,43,.5);
            color: var(--red);
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
            margin-left: 4px;
        }
        .logout-btn:hover { background: var(--red); color: white; }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo-bk">
        <img src="/static/images/hust_logo.png" alt="ĐHBK Hà Nội" style="width:55px;height:55px;object-fit:contain;" onerror="this.src='https://via.placeholder.com/55x55?text=HUST'">
        <div class="logo-bk-text">ĐH Bách Khoa<br>Hà Nội</div>
    </div>
    <div class="header-center">
        <div class="main-title">TÍNH TOÁN, THIẾT KẾ HỆ THỐNG ĐIỀU KHIỂN<br>MÁY CNC ĐỂ BÀN TỰ CHỦ THÔNG MINH</div>
        <div class="sub-title">GVHD: LÊ GIANG NAM</div>
    </div>
    <img src="/static/images/vimes_logo.png" alt="Vimes Lab" style="height: 55px; width: auto;" onerror="this.src='https://via.placeholder.com/55x55?text=V'">
</header>

<!-- User badge -->
<div class="user-badge">
    <span class="user-dot"></span>
    <span>{{ username }}</span>
    <form action="/logout" method="POST" style="display:inline">
        <button class="logout-btn" type="submit">LOGOUT</button>
    </form>
</div>

<!-- MAIN CONTENT -->
<main class="content">
    <div class="home-wrapper">
        <div>
            <div class="home-title">SMART CNC DIGITAL TWIN</div>
            <div class="home-subtitle">HỆ THỐNG ĐIỀU KHIỂN THÔNG MINH</div>
        </div>

        <div class="menu-grid">
            <a class="menu-card" href="/control">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="10" y="18" width="52" height="36" rx="4" fill="none" stroke="#00c9d4" stroke-width="2"/>
                        <rect x="14" y="22" width="22" height="28" rx="2" fill="rgba(0,201,212,.1)" stroke="#00c9d4" stroke-width="1.2"/>
                        <rect x="40" y="26" width="9" height="6" rx="1.5" fill="rgba(0,201,212,.25)" stroke="#00c9d4" stroke-width="1"/>
                        <rect x="52" y="26" width="6" height="6" rx="1.5" fill="rgba(192,57,43,.4)" stroke="#c0392b" stroke-width="1"/>
                        <rect x="40" y="35" width="9" height="6" rx="1.5" fill="rgba(0,201,212,.15)" stroke="#00c9d4" stroke-width="1"/>
                        <rect x="52" y="35" width="6" height="6" rx="1.5" fill="rgba(0,201,212,.15)" stroke="#00c9d4" stroke-width="1"/>
                        <rect x="40" y="44" width="18" height="4" rx="1.5" fill="rgba(212,160,23,.25)" stroke="#d4a017" stroke-width="1"/>
                        <circle cx="25" cy="36" r="7" fill="none" stroke="#00c9d4" stroke-width="1.5"/>
                        <circle cx="25" cy="36" r="2.5" fill="#00c9d4"/>
                    </svg>
                </div>
                <div class="card-label">ĐIỀU KHIỂN</div>
            </a>

            <a class="menu-card" href="/monitor">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="8" y="12" width="56" height="38" rx="3" fill="none" stroke="#00c9d4" stroke-width="2"/>
                        <rect x="12" y="16" width="48" height="30" fill="rgba(0,201,212,.06)"/>
                        <polyline points="14,38 20,32 26,35 32,24 38,28 44,20 50,26 56,22" fill="none" stroke="#00c9d4" stroke-width="2"/>
                        <polyline points="14,42 20,39 26,41 32,35 38,37 44,32 50,36 56,33" fill="none" stroke="#c0392b" stroke-width="1.5"/>
                        <line x1="36" y1="50" x2="36" y2="58" stroke="#00c9d4" stroke-width="2"/>
                        <line x1="26" y1="58" x2="46" y2="58" stroke="#00c9d4" stroke-width="2"/>
                    </svg>
                </div>
                <div class="card-label">GIÁM SÁT</div>
            </a>

            <a class="menu-card" href="/settings">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <circle cx="36" cy="36" r="10" fill="none" stroke="#00c9d4" stroke-width="2.2"/>
                        <circle cx="36" cy="36" r="4" fill="rgba(0,201,212,.3)"/>
                        <rect x="33" y="18" width="6" height="7" rx="1.5" fill="none" stroke="#00c9d4" stroke-width="1.8"/>
                        <rect x="33" y="47" width="6" height="7" rx="1.5" fill="none" stroke="#00c9d4" stroke-width="1.8"/>
                        <rect x="18" y="33" width="7" height="6" rx="1.5" fill="none" stroke="#00c9d4" stroke-width="1.8"/>
                        <rect x="47" y="33" width="7" height="6" rx="1.5" fill="none" stroke="#00c9d4" stroke-width="1.8"/>
                    </svg>
                </div>
                <div class="card-label">THÔNG SỐ</div>
            </a>
        </div>

        <div style="display:flex;gap:24px;align-items:center;margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#6b8fa8;">
                <span style="width:8px;height:8px;border-radius:50%;background:#00b894;display:inline-block;animation:pulse 2s infinite;"></span>
                HỆ THỐNG HOẠT ĐỘNG
            </div>
            <div style="font-size:12px;color:#6b8fa8;" id="clockDisplay"></div>
        </div>
    </div>
</main>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="nav-link active" href="/">HOME</a>
    <a class="nav-link" href="/control">ĐIỀU KHIỂN</a>
    <a class="nav-link" href="/monitor">GIÁM SÁT</a>
    <a class="nav-link" href="/settings">THÔNG SỐ</a>
</nav>

<script>
// Clock
function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const d = now.toLocaleDateString('vi-VN');
    const el = document.getElementById('clockDisplay');
    if (el) el.textContent = '🕐 ' + t + '  |  ' + d;
}
setInterval(updateClock, 1000);
updateClock();

// Active nav highlight
const path = window.location.pathname;
document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.remove('active');
    const href = a.getAttribute('href');
    if (href === path || (path.startsWith(href) && href !== '/')) {
        a.classList.add('active');
    } else if (href === '/' && path === '/') {
        a.classList.add('active');
    }
});

// ========== LOAD THEME TỪ LOCALSTORAGE ==========
function loadThemeFromLocal() {
    const saved = localStorage.getItem('cnc_theme');
    if (saved) {
        try {
            const theme = JSON.parse(saved);
            document.documentElement.style.setProperty('--navy', theme.headerBg || '#0d1b2a');
            document.documentElement.style.setProperty('--steel', theme.sidebarBg || '#1e3a5f');
            document.documentElement.style.setProperty('--cyan', theme.accentColor || '#00c9d4');
            document.documentElement.style.setProperty('--border', theme.borderColor || 'rgba(0,201,212,0.25)');
            document.documentElement.style.setProperty('--white', theme.textColor || '#ffffff');
            console.log('🎨 Theme loaded from localStorage');
        } catch(e) { console.error('Theme parse error:', e); }
    }
}

// Lắng nghe theme thay đổi từ tab khác
window.addEventListener('storage', (event) => {
    if (event.key === 'cnc_theme' && event.newValue) {
        try {
            const theme = JSON.parse(event.newValue);
            document.documentElement.style.setProperty('--navy', theme.headerBg || '#0d1b2a');
            document.documentElement.style.setProperty('--steel', theme.sidebarBg || '#1e3a5f');
            document.documentElement.style.setProperty('--cyan', theme.accentColor || '#00c9d4');
            document.documentElement.style.setProperty('--border', theme.borderColor || 'rgba(0,201,212,0.25)');
            document.documentElement.style.setProperty('--white', theme.textColor || '#ffffff');
            console.log('🎨 Theme updated from another tab');
        } catch(e) {}
    }
});

// Khởi tạo
loadThemeFromLocal();
</script>

</body>
</html>
