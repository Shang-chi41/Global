<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều Khiển - CNC Smart System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #c0392b;
            --gold:   #d4a017;
            --navy:   #0d1b2a;
            --steel:  #1e3a5f;
            --cyan:   #00c9d4;
            --white:  #ffffff;
            --border: rgba(0,201,212,0.22);
            --success: #00b894;
            --warning: #f39c12;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Be Vietnam Pro',sans-serif;
            background:var(--navy); color:var(--white);
            min-height:100vh; display:flex; flex-direction:column;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background-image:
                linear-gradient(rgba(0,201,212,.04) 1px,transparent 1px),
                linear-gradient(90deg,rgba(0,201,212,.04) 1px,transparent 1px);
            background-size:40px 40px; pointer-events:none; z-index:0;
        }

        /* Header (giống monitor) */
        .header {
            background:linear-gradient(135deg,#0d1b2a 0%,#1e3a5f 100%);
            border-bottom:2px solid var(--gold);
            padding:0 28px; display:flex; align-items:center;
            justify-content:space-between; height:88px; flex-shrink:0;
            position:relative; z-index:10;
        }
        .logo-bk { display:flex; align-items:center; gap:10px; }
        .logo-bk-text { font-size:11px; font-weight:600; color:var(--gold); line-height:1.5; text-transform:uppercase; }
        .header-center { text-align:center; flex:1; padding:0 16px; }
        .header-center .main-title { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.7px; line-height:1.45; }
        .header-center .sub-title { font-size:11px; color:var(--gold); margin-top:4px; letter-spacing:.5px; }

        /* User badge */
        .user-badge {
            position:fixed; top:96px; right:16px;
            background:rgba(30,58,95,.85); border:1px solid var(--border);
            border-radius:20px; padding:5px 14px; font-size:12px; color:#6b8fa8;
            display:flex; align-items:center; gap:8px; z-index:20; backdrop-filter:blur(10px);
        }
        .user-dot { width:8px; height:8px; border-radius:50%; background:#00b894; animation:pulse 2s infinite; }
        @keyframes pulse { 50%{opacity:.3} }
        .logout-btn {
            background:transparent; border:1px solid rgba(192,57,43,.5);
            color:var(--red); font-size:11px; padding:3px 10px;
            border-radius:10px; cursor:pointer; transition:.2s;
        }
        .logout-btn:hover { background:var(--red); color:white; }

        /* Main Layout */
        .main {
            flex:1; position:relative; z-index:1;
            padding:20px 24px;
            max-width: 1400px; margin: 0 auto; width: 100%;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .mode-btn {
            flex: 1;
            max-width: 250px;
            padding: 16px 32px;
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: rgba(30,58,95,.5);
            color: #6b8fa8;
        }
        .mode-btn.active {
            background: var(--cyan);
            color: var(--navy);
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,201,212,.5);
        }
        .mode-btn.manual.active { background: var(--warning); border-color: var(--warning); }
        .mode-btn.auto.active { background: var(--success); border-color: var(--success); }

        /* Panel Container */
        .panel-container {
            background: rgba(30,58,95,.35);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            min-height: 500px;
        }

        /* ========== MANUAL MODE ========== */
        .manual-panel {
            display: none;
        }
        .manual-panel.active {
            display: block;
        }
        .connection-card {
            background: rgba(13,27,42,.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .connection-title {
            font-family: 'Orbitron';
            font-size: 14px;
            color: var(--cyan);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .url-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .url-input {
            flex: 1;
            background: rgba(0,0,0,.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            color: white;
            font-family: monospace;
            font-size: 14px;
        }
        .url-input:focus {
            outline: none;
            border-color: var(--cyan);
        }
        .connect-btn {
            background: var(--cyan);
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-family: 'Orbitron';
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,201,212,.4);
        }
        .saved-urls {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,201,212,.2);
        }
        .saved-url-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin: 4px 0;
            background: rgba(0,0,0,.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .saved-url-item:hover {
            background: rgba(0,201,212,.2);
        }
        .delete-url {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 18px;
        }
        .iframe-container {
            margin-top: 24px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            min-height: 500px;
        }
        .control-iframe {
            width: 100%;
            height: 600px;
            border: none;
            background: white;
        }

        /* ========== AUTO MODE ========== */
        .auto-panel {
            display: none;
        }
        .auto-panel.active {
            display: block;
        }
        .gcode-editor {
            background: rgba(13,27,42,.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
        }
        textarea {
            width: 100%;
            background: #0a0f1a;
            border: 1px solid var(--border);
            color: var(--cyan);
            font-family: monospace;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .ctrl-btn {
            flex: 1;
            padding: 12px;
            font-family: 'Orbitron';
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(30,58,95,.8);
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background: var(--cyan);
            color: var(--navy);
        }

        /* Navbar */
        .navbar {
            background:rgba(13,27,42,.97); border-top:1px solid var(--border);
            display:flex; flex-shrink:0; position:sticky; bottom:0; z-index:10;
            box-shadow:0 -4px 24px rgba(0,0,0,.4);
        }
        .nav-link {
            flex:1; text-align:center; padding:13px 8px;
            font-family:'Orbitron'; font-size:11px; font-weight:600;
            letter-spacing:1.5px; color:#6b8fa8; text-decoration:none;
            text-transform:uppercase; border-top:3px solid transparent; transition:.2s;
        }
        .nav-link:hover { color:var(--cyan); }
        .nav-link.active { color:var(--red); border-top-color:var(--red); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 12px;
        }
        .connected { background: rgba(0,184,148,.2); color: var(--success); }
        .disconnected { background: rgba(231,76,60,.2); color: var(--red); }
    </style>
</head>
<body>

<header class="header">
    <div class="logo-bk">
        <svg width="78" height="98" viewBox="0 0 90 113">
          <rect x="0" y="0" width="90" height="113" rx="2" fill="#E8A800"/>
          <rect x="2" y="2" width="43" height="88" fill="#CC1111"/>
          <rect x="45" y="2" width="43" height="88" fill="#FAFAFA"/>
          <rect x="2" y="90" width="86" height="21" fill="#E8A800"/>
          <text x="45" y="104" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="12.5" font-weight="900" fill="#CC1111" letter-spacing="2">BÁCH KHOA</text>
          <polygon points="16,7 17.6,12 22.8,12 18.6,15 20.2,20 16,17 11.8,20 13.4,15 9.2,12 14.4,12" fill="#FFD700"/>
          <text x="67" y="17" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#CC1111" letter-spacing="1">ĐẠI HỌC</text>
          <clipPath id="lH"><rect x="0" y="0" width="45" height="113"/></clipPath>
          <clipPath id="rH"><rect x="45" y="0" width="90" height="113"/></clipPath>
          <circle cx="45" cy="60" r="24" fill="#CC1111" clip-path="url(#lH)"/>
          <circle cx="45" cy="60" r="24" fill="#FAFAFA" clip-path="url(#rH)"/>
          <circle cx="45" cy="60" r="24" fill="none" stroke="#E8A800" stroke-width="3"/>
          <line x1="58" y1="15" x2="28" y2="75" stroke="#E8A800" stroke-width="2.8"/>
        </svg>
        <div class="logo-bk-text">ĐH Bách Khoa<br>Hà Nội</div>
    </div>
    <div class="header-center">
        <div class="main-title">TÍNH TOÁN, THIẾT KẾ HỆ THỐNG ĐIỀU KHIỂN<br>MÁY CNC ĐỂ BÀN TỰ CHỦ THÔNG MINH</div>
        <div class="sub-title">GVHD: LÊ GIANG NAM</div>
    </div>
    <svg width="78" height="78" viewBox="0 0 110 110">
      <circle cx="55" cy="55" r="54" fill="#00B5B8"/>
      <circle cx="55" cy="55" r="47" fill="white"/>
      <text x="8" y="84" font-family="Georgia" font-size="85" fill="#7DCFCF">V</text>
      <text x="50" y="84" font-family="Georgia" font-size="85" fill="#7DCFCF">R</text>
    </svg>
</header>

<div class="user-badge">
    <span class="user-dot"></span>
    <span>{{ username }}</span>
    <form action="/logout" method="POST" style="display:inline">
        <button class="logout-btn" type="submit">LOGOUT</button>
    </form>
</div>

<main class="main">
    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <div class="mode-btn manual" onclick="setMode('manual')">🖐️ THỦ CÔNG</div>
        <div class="mode-btn auto" onclick="setMode('auto')">🤖 TỰ ĐỘNG</div>
    </div>

    <div class="panel-container">
        <!-- ========== MANUAL PANEL ========== -->
        <div id="manualPanel" class="manual-panel">
            <div class="connection-card">
                <div class="connection-title">
                    🔌 KẾT NỐI ĐIỀU KHIỂN THỦ CÔNG
                    <span id="connectionStatus" class="status-badge disconnected">Chưa kết nối</span>
                </div>
                
                <div class="url-input-group">
                    <input type="text" id="deviceUrl" class="url-input" 
                           placeholder="Nhập địa chỉ IP hoặc URL (VD: http://192.168.1.100:8080 hoặc http://localhost:5000)">
                    <button class="connect-btn" onclick="connectToDevice()">🔗 KẾT NỐI</button>
                </div>
                
                <div class="saved-urls">
                    <div style="font-size: 12px; color: var(--cyan); margin-bottom: 8px;">📌 ĐÃ LƯU:</div>
                    <div id="savedUrlsList"></div>
                </div>
            </div>
            
            <div id="iframeContainer" class="iframe-container" style="display: none;">
                <div style="background: var(--navy); padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
                    <span style="font-size: 12px;" id="currentUrl"></span>
                    <button onclick="closeIframe()" style="background: none; border: none; color: var(--red); cursor: pointer;">✖ Đóng</button>
                </div>
                <iframe id="controlIframe" class="control-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <!-- ========== AUTO PANEL ========== -->
        <div id="autoPanel" class="auto-panel">
            <div class="gcode-editor">
                <h3 style="color: var(--cyan); margin-bottom: 16px;">📝 G-CODE TỰ ĐỘNG</h3>
                <textarea id="gcodeInput" rows="10" placeholder="G21 (mm)
G90 (Absolute)
G0 X0 Y0 Z0
G1 X100 Y50 Z10 F500
M30"></textarea>
                <div class="control-buttons">
                    <button class="ctrl-btn" onclick="sendGCode()">▶ CHẠY G-CODE</button>
                    <button class="ctrl-btn" onclick="stopMachine()">⏹ DỪNG KHẨN CẤP</button>
                    <button class="ctrl-btn" onclick="homeMachine()">🏠 HOME</button>
                </div>
                <div id="autoStatus" style="margin-top: 16px; padding: 12px; background: rgba(0,0,0,.3); border-radius: 8px; font-family: monospace; font-size: 12px;"></div>
            </div>
        </div>
    </div>
</main>

<nav class="navbar">
    <a class="nav-link" href="/">HOME</a>
    <a class="nav-link active" href="/control">ĐIỀU KHIỂN</a>
    <a class="nav-link" href="/monitor">GIÁM SÁT</a>
    <a class="nav-link" href="/settings">THÔNG SỐ</a>
</nav>

<script>
// State
let currentMode = 'manual';
let currentIframeUrl = '';
let savedUrls = [];

// Load saved URLs from localStorage
function loadSavedUrls() {
    const urls = localStorage.getItem('cnc_manual_urls');
    if (urls) {
        savedUrls = JSON.parse(urls);
    } else {
        // Default demo URLs
        savedUrls = [
            { name: 'GRBL WebUI', url: 'http://localhost:8080' },
            { name: 'ESP32 CNC', url: 'http://192.168.1.100' }
        ];
    }
    renderSavedUrls();
}

// Save URLs to localStorage
function saveUrls() {
    localStorage.setItem('cnc_manual_urls', JSON.stringify(savedUrls));
    renderSavedUrls();
}

// Render saved URLs list
function renderSavedUrls() {
    const container = document.getElementById('savedUrlsList');
    if (!container) return;
    
    if (savedUrls.length === 0) {
        container.innerHTML = '<div style="color: #4a6a80; font-size: 12px;">Chưa có địa chỉ nào được lưu</div>';
        return;
    }
    
    container.innerHTML = savedUrls.map((item, index) => `
        <div class="saved-url-item" onclick="useSavedUrl('${item.url}')">
            <span>🔗 ${item.name} <span style="color: var(--cyan); font-size: 11px;">${item.url}</span></span>
            <button class="delete-url" onclick="event.stopPropagation(); deleteSavedUrl(${index})">🗑</button>
        </div>
    `).join('');
}

// Use a saved URL
function useSavedUrl(url) {
    document.getElementById('deviceUrl').value = url;
    connectToDevice();
}

// Delete saved URL
function deleteSavedUrl(index) {
    savedUrls.splice(index, 1);
    saveUrls();
}

// Add new URL to saved list
function addToSavedUrls(url) {
    // Check if already exists
    if (savedUrls.some(item => item.url === url)) return;
    
    let name = prompt('Nhập tên cho địa chỉ này:', url.split('//')[1]?.split(':')[0] || 'CNC Device');
    if (name) {
        savedUrls.push({ name: name, url: url });
        saveUrls();
    }
}

// Connect to device
function connectToDevice() {
    let url = document.getElementById('deviceUrl').value.trim();
    if (!url) {
        alert('Vui lòng nhập địa chỉ IP hoặc URL');
        return;
    }
    
    // Auto add http:// if missing
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
    }
    
    currentIframeUrl = url;
    
    // Show iframe container
    const iframeContainer = document.getElementById('iframeContainer');
    const iframe = document.getElementById('controlIframe');
    const currentUrlSpan = document.getElementById('currentUrl');
    
    iframe.src = url;
    iframeContainer.style.display = 'block';
    currentUrlSpan.textContent = `Đang kết nối: ${url}`;
    
    // Update status
    const statusSpan = document.getElementById('connectionStatus');
    statusSpan.textContent = 'Đã kết nối';
    statusSpan.className = 'status-badge connected';
    
    // Ask to save
    setTimeout(() => {
        if (confirm('Bạn có muốn lưu địa chỉ này để dùng sau không?')) {
            addToSavedUrls(url);
        }
    }, 1000);
    
    // Try to ping the device to check connection
    checkConnection(url);
}

// Close iframe
function closeIframe() {
    const iframeContainer = document.getElementById('iframeContainer');
    const iframe = document.getElementById('controlIframe');
    iframe.src = 'about:blank';
    iframeContainer.style.display = 'none';
    
    const statusSpan = document.getElementById('connectionStatus');
    statusSpan.textContent = 'Chưa kết nối';
    statusSpan.className = 'status-badge disconnected';
}

// Check connection to device
async function checkConnection(url) {
    try {
        // Try to fetch a simple endpoint
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        const response = await fetch(url + '/api/status', {
            method: 'GET',
            mode: 'no-cors', // To avoid CORS issues
            signal: controller.signal
        }).catch(() => null);
        
        clearTimeout(timeoutId);
        
        // Update status (even with no-cors we assume connected if no error)
        const statusSpan = document.getElementById('connectionStatus');
        statusSpan.textContent = 'Đã kết nối + ping OK';
        statusSpan.className = 'status-badge connected';
        
    } catch (error) {
        console.log('Ping failed, but iframe may still work');
    }
}

// ========== AUTO MODE FUNCTIONS ==========
function sendGCode() {
    const gcode = document.getElementById('gcodeInput').value;
    const statusDiv = document.getElementById('autoStatus');
    
    statusDiv.innerHTML = '⏳ Đang gửi G-Code đến máy CNC...';
    
    fetch('/api/control/gcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gcode: gcode })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'ok') {
            statusDiv.innerHTML = '✅ G-Code đã được gửi thành công!';
        } else {
            statusDiv.innerHTML = '❌ Lỗi: ' + (data.error || 'Không thể gửi');
        }
    })
    .catch(error => {
        statusDiv.innerHTML = '❌ Lỗi kết nối: ' + error.message;
    });
}

function stopMachine() {
    const statusDiv = document.getElementById('autoStatus');
    statusDiv.innerHTML = '🛑 Đang gửi lệnh DỪNG KHẨN CẤP...';
    
    fetch('/api/control/stop', { method: 'POST' })
    .then(response => response.json())
    .then(data => {
        statusDiv.innerHTML = '🛑 Đã dừng khẩn cấp!';
    })
    .catch(error => {
        statusDiv.innerHTML = '❌ Lỗi: ' + error.message;
    });
}

function homeMachine() {
    const statusDiv = document.getElementById('autoStatus');
    statusDiv.innerHTML = '🏠 Đang đưa máy về HOME...';
    
    fetch('/api/control/home', { method: 'POST' })
    .then(response => response.json())
    .then(data => {
        statusDiv.innerHTML = '🏠 Đã về HOME!';
    })
    .catch(error => {
        statusDiv.innerHTML = '❌ Lỗi: ' + error.message;
    });
}

// Set mode
function setMode(mode) {
    currentMode = mode;
    
    // Update button styles
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`.mode-btn.${mode}`).classList.add('active');
    
    // Show/hide panels
    const manualPanel = document.getElementById('manualPanel');
    const autoPanel = document.getElementById('autoPanel');
    
    if (mode === 'manual') {
        manualPanel.classList.add('active');
        autoPanel.classList.remove('active');
    } else {
        manualPanel.classList.remove('active');
        autoPanel.classList.add('active');
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadSavedUrls();
    setMode('manual');
});
</script>

</body>
</html>
