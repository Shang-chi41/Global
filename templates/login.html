<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - CNC Smart System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Be+Vietnam+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/isa101.css">
    <style>
        :root {
            --red:    #c0392b;
            --gold:   #d4a017;
            --navy:   #0d1b2a;
            --steel:  #1e3a5f;
            --cyan:   #00c9d4;
            --light:  #e8f4f8;
            --white:  #ffffff;
            --border: rgba(0,201,212,0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Grid background ── */
        body::before {
            content:'';
            position:fixed; inset:0;
            background-image:
                linear-gradient(rgba(0,201,212,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,201,212,.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events:none;
        }

        /* ══════════════ HEADER ══════════════ */
        .header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1e3a5f 100%);
            border-bottom: 2px solid var(--gold);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
            position: relative;
            flex-shrink: 0;
        }
        .header::after {
            content:'';
            position:absolute; bottom:-4px; left:0; right:0;
            height:2px; background: var(--cyan); opacity:.4;
        }

        /* Logo Bách Khoa */
        .logo-bk {
            display:flex; align-items:center; gap:10px;
        }
        .logo-bk svg { flex-shrink:0; }
        .logo-bk-text {
            font-family:'Be Vietnam Pro'; font-size:11px; font-weight:600;
            color:var(--gold); line-height:1.4; text-transform:uppercase; letter-spacing:.5px;
        }

        /* Header center text */
        .header-center {
            text-align:center; flex:1; padding:0 20px;
        }
        .header-center .main-title {
            font-family:'Be Vietnam Pro'; font-weight:700;
            font-size:13px; color:var(--white);
            text-transform:uppercase; letter-spacing:.8px; line-height:1.4;
        }
        .header-center .sub-title {
            font-size:11px; color:var(--gold);
            font-weight:400; margin-top:4px; letter-spacing:.5px;
        }

        /* Logo VR */
        .logo-vr svg { border-radius:50%; overflow:hidden; }

        /* ══════════════ MAIN ══════════════ */
        .main {
            flex:1; display:flex;
            align-items:center; justify-content:center;
            padding:40px 20px;
        }

        .login-card {
            background: rgba(30,58,95,0.55);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px 48px;
            width: 100%; max-width: 420px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 60px rgba(0,201,212,.08), 0 20px 60px rgba(0,0,0,.4);
            animation: fadeUp .5s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .login-title {
            font-family:'Orbitron'; font-size:14px; font-weight:600;
            color:var(--cyan); text-align:center; letter-spacing:2px;
            text-transform:uppercase; margin-bottom:32px;
            padding-bottom:16px;
            border-bottom: 1px solid var(--border);
        }

        .form-row {
            display:flex; align-items:center; gap:12px; margin-bottom:18px;
        }
        .form-row label {
            font-size:13px; color:var(--light); width:72px;
            font-weight:600; letter-spacing:.5px; flex-shrink:0;
        }
        .form-row input {
            flex:1; background:rgba(255,255,255,.06);
            border:1px solid rgba(0,201,212,.25);
            border-radius:2px; padding:9px 14px;
            color:var(--white); font-size:13px;
            font-family:'Be Vietnam Pro';
            outline:none; transition:.2s;
        }
        .form-row input:focus {
            border-color: var(--cyan);
            background: rgba(0,201,212,.08);
            box-shadow: 0 0 0 3px rgba(0,201,212,.1);
        }

        .error-msg {
            color:#ff6b6b; font-size:12px; text-align:center;
            margin-bottom:12px; min-height:18px;
        }

        .btn-enter {
            display:block; width:140px; margin:24px auto 0;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-family:'Orbitron'; font-size:13px; font-weight:600;
            letter-spacing:3px; padding:11px 20px;
            border-radius:2px; cursor:pointer;
            transition:.25s; text-transform:uppercase;
            position:relative; overflow:hidden;
        }
        .btn-enter::before {
            content:''; position:absolute; inset:0;
            background:var(--cyan); transform:scaleX(0);
            transform-origin:left; transition:.3s ease;
            z-index:0;
        }
        .btn-enter:hover::before { transform:scaleX(1); }
        .btn-enter:hover { color:var(--navy); }
        .btn-enter span { position:relative; z-index:1; }
    </style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header class="header">
    <!-- Logo Bách Khoa (SVG) -->
    <div class="logo-bk">
        <svg width="78" height="98" viewBox="0 0 90 113" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer border gold -->
  <rect x="0" y="0" width="90" height="113" rx="2" fill="#E8A800"/>

  <!-- Left half: RED -->
  <rect x="2" y="2" width="43" height="88" fill="#CC1111"/>
  <!-- Right half: WHITE -->
  <rect x="45" y="2" width="43" height="88" fill="#FAFAFA"/>

  <!-- Bottom gold band -->
  <rect x="2" y="90" width="86" height="21" fill="#E8A800"/>
  <text x="45" y="104" text-anchor="middle"
        font-family="Arial Black,sans-serif" font-size="12.5" font-weight="900"
        fill="#CC1111" letter-spacing="2">BÁCH KHOA</text>

  <!-- Star (top-left, on red) -->
  <polygon points="16,7 17.6,12 22.8,12 18.6,15 20.2,20 16,17 11.8,20 13.4,15 9.2,12 14.4,12"
           fill="#FFD700"/>

  <!-- ĐẠI HỌC (top-right, on white) -->
  <text x="67" y="17" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="bold"
        fill="#CC1111" letter-spacing="1">ĐẠI HỌC</text>

  <!-- GEAR centered on dividing line, large -->
  <!-- Gear body: left=red fill, right=white fill, outline gold -->
  <clipPath id="leftHalf">
    <rect x="0" y="0" width="45" height="113"/>
  </clipPath>
  <clipPath id="rightHalf">
    <rect x="45" y="0" width="90" height="113"/>
  </clipPath>

  <!-- Gear left half (red background shows through) -->
  <circle cx="45" cy="60" r="24" fill="#CC1111" clip-path="url(#leftHalf)"/>
  <!-- Gear right half (white background shows through) -->
  <circle cx="45" cy="60" r="24" fill="#FAFAFA" clip-path="url(#rightHalf)"/>

  <!-- Gear teeth - gold outline all around -->
  <!-- Top teeth -->
  <rect x="41.5" y="32" width="7" height="8" rx="1.5" fill="#E8A800"/>
  <!-- Bottom teeth -->
  <rect x="41.5" y="72" width="7" height="8" rx="1.5" fill="#E8A800"/>
  <!-- Left teeth -->
  <rect x="17" y="56.5" width="8" height="7" rx="1.5" fill="#E8A800"/>
  <!-- Right teeth -->
  <rect x="65" y="56.5" width="8" height="7" rx="1.5" fill="#E8A800"/>
  <!-- Diagonal teeth NW -->
  <rect x="24" y="37" width="7" height="7" rx="1.5" fill="#E8A800" transform="rotate(45 27.5 40.5)"/>
  <!-- Diagonal teeth NE -->
  <rect x="59" y="37" width="7" height="7" rx="1.5" fill="#E8A800" transform="rotate(45 62.5 40.5)"/>
  <!-- Diagonal teeth SW -->
  <rect x="24" y="69" width="7" height="7" rx="1.5" fill="#E8A800" transform="rotate(45 27.5 72.5)"/>
  <!-- Diagonal teeth SE -->
  <rect x="59" y="69" width="7" height="7" rx="1.5" fill="#E8A800" transform="rotate(45 62.5 72.5)"/>

  <!-- Gear ring gold outline -->
  <circle cx="45" cy="60" r="24" fill="none" stroke="#E8A800" stroke-width="3"/>
  <!-- Inner gear hole -->
  <circle cx="45" cy="60" r="12" fill="none" stroke="#E8A800" stroke-width="2.5"/>
  <!-- Inner hole fill: left=red, right=white -->
  <circle cx="45" cy="60" r="11" fill="#CC1111" clip-path="url(#leftHalf)"/>
  <circle cx="45" cy="60" r="11" fill="#FAFAFA" clip-path="url(#rightHalf)"/>

  <!-- Compass / compa tool -->
  <!-- Pivot point top-right area -->
  <!-- Left arm of compass (going down-left) -->
  <line x1="58" y1="15" x2="28" y2="75" stroke="#E8A800" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right arm of compass (going down, slightly right) -->
  <line x1="58" y1="15" x2="52" y2="75" stroke="#E8A800" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Pivot circle at top -->
  <circle cx="58" cy="15" r="3.5" fill="#E8A800"/>
  <!-- Cross-bar / hinge in middle of compass -->
  <rect x="37" y="43" width="16" height="4" rx="2" fill="#E8A800" transform="rotate(-72 45 45)"/>
  <!-- Needle tips at bottom -->
  <circle cx="28" cy="76" r="2" fill="#E8A800"/>
  <circle cx="52" cy="76" r="2" fill="#E8A800"/>

  <!-- Dividing line between red/white -->
  <line x1="45" y1="2" x2="45" y2="90" stroke="#E8A800" stroke-width="1.5"/>
</svg>
        <div class="logo-bk-text">
            ĐH Bách Khoa<br>Hà Nội
        </div>
    </div>

    <!-- Tiêu đề trung tâm -->
    <div class="header-center">
        <div class="main-title">
            TÍNH TOÁN, THIẾT KẾ HỆ THỐNG ĐIỀU KHIỂN<br>
            MÁY CNC ĐỂ BÀN TỰ CHỦ THÔNG MINH
        </div>
        <div class="sub-title">GVHD: LÊ GIANG NAM</div>
    </div>

    <!-- Logo VR -->
    <div class="logo-vr">
        <svg width="78" height="78" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
  <circle cx="55" cy="55" r="54" fill="#00B5B8"/>
  <circle cx="55" cy="55" r="47" fill="white"/>
  <text x="8" y="84" font-family="Georgia,Times New Roman,serif" font-size="85" font-weight="300" fill="#7DCFCF" opacity="0.9">V</text>
  <text x="50" y="84" font-family="Georgia,Times New Roman,serif" font-size="85" font-weight="300" fill="#7DCFCF" opacity="0.9">R</text>
  <line x1="9"  y1="63" x2="22" y2="63" stroke="#CC2222" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="88" y1="63" x2="101" y2="63" stroke="#CC2222" stroke-width="2.8" stroke-linecap="round"/>
  <text x="55" y="68" text-anchor="middle" font-family="Brush Script MT,Segoe Script,URW Chancery L,cursive" font-size="21" fill="#CC2222" font-style="italic">Vimes Lab</text>
  <text x="55" y="88" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" fill="#00B5B8" letter-spacing="3.5">DIGITAL TWINS</text>
</svg>
    </div>
    </header>

<!-- ══════════ LOGIN FORM ══════════ -->
<main class="main">
    <div class="login-card">
        <div class="login-title">ĐĂNG NHẬP HỆ THỐNG</div>

        <form method="POST" action="/login" onsubmit="return handleLogin(event)">
            <div class="form-row">
                <label for="username">User</label>
                <input type="text" id="username" name="username"
                       autocomplete="username" spellcheck="false" required>
            </div>
            <div class="form-row">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <div class="error-msg" id="errMsg">
                {% if error %}{{ error }}{% endif %}
            </div>

            <button type="submit" class="btn-enter"><span>ENTER</span></button>
        </form>
    </div>
</main>

<script>
function handleLogin(e) {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const err  = document.getElementById('errMsg');
    if (!user || !pass) {
        e.preventDefault();
        err.textContent = '⚠ Vui lòng nhập đầy đủ thông tin.';
        return false;
    }
    return true;
}
// Xóa lỗi khi gõ lại
document.querySelectorAll('input').forEach(el =>
    el.addEventListener('input', () => document.getElementById('errMsg').textContent = '')
);
// Enter key focus
document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
});
</script>
</body>
</html>
