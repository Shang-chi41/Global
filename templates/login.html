<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CNC Digital Twin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/isa101.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: var(--gray-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--white-primary);
        }

        /* Header */
        .header {
            background: var(--gray-card);
            border-bottom: 2px solid var(--gray-border);
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 88px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--status-alarm);
        }

        .logo-bk { display: flex; align-items: center; gap: 12px; }
        .logo-bk img { height: 55px; width: auto; object-fit: contain; }
        .logo-bk-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--white-muted);
            line-height: 1.4;
            text-transform: uppercase;
        }

        .header-center { text-align: center; flex: 1; padding: 0 16px; }
        .header-center .main-title {
            font-weight: 700;
            font-size: 13px;
            color: var(--white-primary);
            text-transform: uppercase;
            letter-spacing: .7px;
        }
        .header-center .sub-title {
            font-size: 11px;
            color: var(--white-muted);
            margin-top: 4px;
        }

        /* Navbar */
        .navbar {
            background: var(--gray-card);
            border-top: 1px solid var(--gray-border);
            display: flex;
            flex-shrink: 0;
            margin-top: auto;
        }
        .nav-link {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--white-secondary);
            text-decoration: none;
            text-transform: uppercase;
            border-top: 3px solid transparent;
            transition: .2s;
        }
        .nav-link:hover {
            color: var(--cyan-portal);
            background: rgba(30, 95, 168, 0.05);
        }
        .nav-link.active {
            color: var(--status-alarm);
            border-top-color: var(--status-alarm);
        }

        /* Content */
        .content {
            flex: 1;
            position: relative;
            z-index: 1;
            padding: 32px 28px;
        }

        /* Home Page */
        .home-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 88px - 50px);
            gap: 40px;
        }
        .home-title {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 800;
            color: var(--cyan-portal);
            letter-spacing: 4px;
            text-align: center;
        }
        .home-subtitle {
            font-size: 12px;
            color: var(--white-muted);
            letter-spacing: 3px;
            text-align: center;
            margin-top: -30px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 680px;
            width: 100%;
        }
        .menu-card {
            background: var(--gray-card);
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 36px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--white-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: .3s;
            box-shadow: var(--card-shadow);
        }
        .menu-card:hover {
            border-color: var(--cyan-portal);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        .card-icon svg { stroke: var(--cyan-portal); }
        .card-label {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--white-secondary);
            text-transform: uppercase;
        }

        /* User Badge */
        .user-badge {
            position: fixed;
            top: 100px;
            right: 20px;
            background: var(--gray-card);
            border: 1px solid var(--gray-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--white-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            box-shadow: var(--card-shadow);
        }
        .user-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-active);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--status-alarm);
            color: var(--status-alarm);
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background: var(--status-alarm);
            color: white;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <!-- Logo Bách Khoa -->
    <div class="logo-bk">
        <img src="/static/images/logo_hust.png" alt="ĐHBK Hà Nội" onerror="this.src='https://via.placeholder.com/55x55?text=HUST'">
        <div class="logo-bk-text">ĐH Bách Khoa<br>Hà Nội</div>
    </div>

    <!-- Tiêu đề -->
    <div class="header-center">
        <div class="main-title">
            TÍNH TOÁN, THIẾT KẾ HỆ THỐNG ĐIỀU KHIỂN<br>
            MÁY CNC ĐỂ BÀN TỰ CHỦ THÔNG MINH
        </div>
        <div class="sub-title">GVHD: LÊ GIANG NAM</div>
    </div>

    <!-- Logo Vimes Lab -->
    <img src="/static/images/vimes_logo.png" alt="Vimes Lab" style="height: 55px; width: auto;" onerror="this.src='https://via.placeholder.com/55x55?text=V'">
</header>

<!-- User badge -->
<div class="user-badge">
    <span class="user-dot"></span>
    <span id="usernameDisplay">{{ username }}</span>
    <form action="/logout" method="POST" style="display:inline">
        <button class="logout-btn" type="submit">LOGOUT</button>
    </form>
</div>

<!-- MAIN CONTENT -->
<main class="content">
    <div class="home-wrapper">
        <div>
            <div class="home-title">SMART CNC DIGITAL TWIN</div>
            <div class="home-subtitle">HỆ THỐNG ĐIỀU KHIỂN THÔNG MINH</div>
        </div>

        <div class="menu-grid">
            <a class="menu-card" href="/control">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="10" y="18" width="52" height="36" rx="4" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <rect x="14" y="22" width="22" height="28" rx="2" fill="rgba(30,95,168,.1)" stroke="var(--cyan-portal)" stroke-width="1.2"/>
                        <rect x="40" y="26" width="9" height="6" rx="1.5" fill="rgba(30,95,168,.2)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="52" y="26" width="6" height="6" rx="1.5" fill="rgba(204,0,0,.3)" stroke="var(--status-alarm)" stroke-width="1"/>
                        <rect x="40" y="35" width="9" height="6" rx="1.5" fill="rgba(30,95,168,.1)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="52" y="35" width="6" height="6" rx="1.5" fill="rgba(30,95,168,.1)" stroke="var(--cyan-portal)" stroke-width="1"/>
                        <rect x="40" y="44" width="18" height="4" rx="1.5" fill="rgba(255,204,0,.2)" stroke="var(--status-warning)" stroke-width="1"/>
                        <circle cx="25" cy="36" r="7" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5"/>
                        <circle cx="25" cy="36" r="2.5" fill="var(--cyan-portal)"/>
                    </svg>
                </div>
                <div class="card-label">ĐIỀU KHIỂN</div>
            </a>

            <a class="menu-card" href="/monitor">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <rect x="8" y="12" width="56" height="38" rx="3" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <rect x="12" y="16" width="48" height="30" fill="rgba(30,95,168,.05)"/>
                        <polyline points="14,38 20,32 26,35 32,24 38,28 44,20 50,26 56,22" fill="none" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <polyline points="14,42 20,39 26,41 32,35 38,37 44,32 50,36 56,33" fill="none" stroke="var(--status-alarm)" stroke-width="1.5"/>
                        <line x1="36" y1="50" x2="36" y2="58" stroke="var(--cyan-portal)" stroke-width="2"/>
                        <line x1="26" y1="58" x2="46" y2="58" stroke="var(--cyan-portal)" stroke-width="2"/>
                    </svg>
                </div>
                <div class="card-label">GIÁM SÁT</div>
            </a>

            <a class="menu-card" href="/settings">
                <div class="card-icon">
                    <svg width="72" height="72" viewBox="0 0 72 72">
                        <circle cx="36" cy="36" r="10" fill="none" stroke="var(--cyan-portal)" stroke-width="2.2"/>
                        <circle cx="36" cy="36" r="4" fill="rgba(30,95,168,.3)"/>
                        <rect x="33" y="18" width="6" height="7" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="33" y="47" width="6" height="7" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="18" y="33" width="7" height="6" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="47" y="33" width="7" height="6" rx="1.5" fill="none" stroke="var(--cyan-portal)" stroke-width="1.8"/>
                        <rect x="22" y="22" width="5" height="5" rx="1.2" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5" transform="rotate(45 24.5 24.5)"/>
                        <rect x="45" y="22" width="5" height="5" rx="1.2" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5" transform="rotate(45 47.5 24.5)"/>
                        <rect x="22" y="45" width="5" height="5" rx="1.2" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5" transform="rotate(45 24.5 47.5)"/>
                        <rect x="45" y="45" width="5" height="5" rx="1.2" fill="none" stroke="var(--cyan-portal)" stroke-width="1.5" transform="rotate(45 47.5 47.5)"/>
                    </svg>
                </div>
                <div class="card-label">THÔNG SỐ</div>
            </a>
        </div>

        <div style="display:flex;gap:24px;align-items:center;margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--white-muted);">
                <span style="width:8px;height:8px;border-radius:50%;background:var(--status-active);display:inline-block;animation:pulse 2s infinite;"></span>
                HỆ THỐNG HOẠT ĐỘNG
            </div>
            <div style="font-size:12px;color:var(--white-muted);" id="clockDisplay"></div>
        </div>
    </div>
</main>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="nav-link active" href="/">HOME</a>
    <a class="nav-link" href="/control">ĐIỀU KHIỂN</a>
    <a class="nav-link" href="/monitor">GIÁM SÁT</a>
    <a class="nav-link" href="/settings">THÔNG SỐ</a>
</nav>

<script>
function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const d = now.toLocaleDateString('vi-VN');
    const el = document.getElementById('clockDisplay');
    if (el) el.textContent = '🕐 ' + t + '  |  ' + d;
}
setInterval(updateClock, 1000);
updateClock();

const path = window.location.pathname;
document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.remove('active');
    const href = a.getAttribute('href');
    if (href === path || (path.startsWith(href) && href !== '/')) {
        a.classList.add('active');
    } else if (href === '/' && path === '/') {
        a.classList.add('active');
    }
});
</script>
</body>
</html>
