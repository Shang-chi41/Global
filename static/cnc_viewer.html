<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC 3D Viewer - Auto Save</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        background: #0a0e14;
        font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .viewer-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(20px);
        border-radius: 18px;
        border: 1px solid rgba(0, 229, 255, 0.12);
        z-index: 100;
        width: 228px;
        overflow: hidden;
    }

    .viewer-panel.collapsed {
        opacity: 0;
        pointer-events: none;
        transform: translateX(20px);
    }

    .panel-reopen {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        background: rgba(10, 14, 20, 0.88);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 229, 255, 0.25);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        z-index: 101;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        color: #00e5ff;
    }

    .panel-reopen.visible {
        opacity: 1;
        pointer-events: all;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(0, 229, 255, 0.08);
    }

    .panel-title {
        font-size: 11px;
        font-weight: 700;
        color: #00e5ff;
        letter-spacing: 1.5px;
    }

    .panel-toggle {
        background: none;
        border: none;
        color: rgba(0,229,255,0.5);
        cursor: pointer;
        font-size: 16px;
        width: 24px;
        height: 24px;
        border-radius: 6px;
    }

    .panel-toggle:hover {
        background: rgba(0,229,255,0.15);
        color: #00e5ff;
    }

    .panel-content {
        padding: 12px;
        max-height: 520px;
        overflow-y: auto;
    }

    .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 10px;
    }

    .btn-icon {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        color: #9ab8cc;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 9px;
        font-size: 10.5px;
        font-weight: 600;
        transition: all 0.15s ease;
    }

    .btn-icon:hover {
        background: rgba(0,229,255,0.12);
        border-color: rgba(0,229,255,0.3);
        color: #00e5ff;
        transform: translateY(-1px);
    }

    .btn-icon.active {
        background: rgba(0,229,255,0.15);
        border-color: rgba(0,229,255,0.4);
        color: #00e5ff;
    }

    .btn-mode-drag.active { background: rgba(255, 107, 0, 0.25); border-color: rgba(255, 107, 0, 0.6); color: #ff6b00; }
    .btn-mode-rotate.active { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.4); color: #00e5ff; }
    .btn-axis-x { color: #ff7777; }
    .btn-axis-y { color: #7799ff; }
    .btn-axis-z { color: #77ee88; }
    .btn-danger { background: rgba(231, 76, 60, 0.1); border-color: rgba(231,76,60,0.2); color: #ff8877; }
    .btn-warning { background: rgba(243, 156, 18, 0.1); border-color: rgba(243,156,18,0.2); color: #ffcc66; }

    .separator {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,229,255,0.15), transparent);
        margin: 10px 0;
    }

    .section-label {
        font-size: 8.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: rgba(255, 170, 102, 0.7);
        margin: 6px 0 5px 0;
    }

    .slider-item { margin: 8px 0; }
    .slider-label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: rgba(138, 174, 192, 0.8);
        margin-bottom: 5px;
    }
    .slider-track {
        position: relative;
        height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 10px;
    }
    .slider-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        background: linear-gradient(90deg, #0099bb, #00e5ff);
        border-radius: 10px;
        pointer-events: none;
    }
    input[type="range"] {
        position: absolute;
        inset: -6px 0;
        width: 100%;
        height: calc(100% + 12px);
        opacity: 0;
        cursor: pointer;
    }

    .info-badge {
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(0,229,255,0.08);
        border-radius: 10px;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        margin-top: 6px;
    }
    .info-badge .badge-val { color: #00e5ff; font-weight: 700; }

    .upload-area {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(10, 14, 20, 0.88);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 229, 255, 0.25);
        border-radius: 40px;
        padding: 10px 22px;
        cursor: pointer;
        z-index: 100;
        font-size: 12px;
        font-weight: 600;
        color: #00e5ff;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .file-info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(10px);
        padding: 7px 16px;
        border-radius: 30px;
        font-size: 10.5px;
        z-index: 100;
        border-left: 2px solid #00e5ff;
    }

    .status {
        position: fixed;
        bottom: 64px;
        left: 20px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(6px);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 9.5px;
        pointer-events: none;
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: #0a0e14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 200;
        transition: opacity 0.5s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner-ring {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #00e5ff;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar {
        width: 220px;
        height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 10px;
        overflow: hidden;
    }
    .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00e5ff, #ff6b00);
        transition: width 0.3s;
    }

    .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        background: rgba(0,229,255,0.12);
        border: 1px solid rgba(0,229,255,0.3);
        backdrop-filter: blur(12px);
        color: #00e5ff;
        padding: 8px 20px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        pointer-events: none;
        z-index: 300;
        opacity: 0;
        transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="overlay">
    <div class="spinner-ring"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="load-msg">Đang khởi tạo...</div>
</div>

<div class="toast" id="toast"></div>
<div class="panel-reopen" id="panelReopen">🎮</div>

<div class="viewer-panel" id="viewerPanel">
    <div class="panel-header">
        <span class="panel-title">CNC VIEWER</span>
        <button class="panel-toggle" id="panelToggle">−</button>
    </div>
    <div class="panel-content">
        <div class="section-label">Hiển thị</div>
        <div class="btn-group">
            <button class="btn-icon" id="btnWire">WIRE</button>
            <button class="btn-icon" id="btnGrid">GRID</button>
            <button class="btn-icon" id="btnAxes">AXES</button>
            <button class="btn-icon btn-danger" id="btnResetCam">↩ CAM</button>
        </div>
        <div class="separator"></div>
        <div class="section-label">Chế độ</div>
        <div class="btn-group">
            <button class="btn-icon btn-mode-drag active" id="modeDrag">✋ Kéo</button>
            <button class="btn-icon btn-mode-rotate" id="modeRotate">⌛ Xoay</button>
        </div>
        <div class="section-label">Di chuyển</div>
        <div class="btn-group">
            <button class="btn-icon btn-axis-x" id="moveLeft">◀ X-</button>
            <button class="btn-icon btn-axis-x" id="moveRight">X+ ▶</button>
            <button class="btn-icon btn-axis-y" id="moveBack">◀ Y-</button>
            <button class="btn-icon btn-axis-y" id="moveForward">Y+ ▶</button>
            <button class="btn-icon btn-axis-z" id="moveDown">▼ Z-</button>
            <button class="btn-icon btn-axis-z" id="moveUp">Z+ ▲</button>
            <button class="btn-icon btn-warning" id="resetPos">↺ Reset</button>
        </div>
        <div class="separator"></div>
        <div class="section-label">Xoay</div>
        <div class="btn-group">
            <button class="btn-icon btn-axis-x" id="rotXP">X+90°</button>
            <button class="btn-icon btn-axis-x" id="rotXM">X−90°</button>
            <button class="btn-icon btn-axis-y" id="rotYP">Y+90°</button>
            <button class="btn-icon btn-axis-y" id="rotYM">Y−90°</button>
            <button class="btn-icon btn-axis-z" id="rotZP">Z+90°</button>
            <button class="btn-icon btn-axis-z" id="rotZM">Z−90°</button>
        </div>
        <div class="btn-group">
            <button class="btn-icon btn-axis-x" id="flipX">🪞 X</button>
            <button class="btn-icon btn-axis-y" id="flipY">🪞 Y</button>
            <button class="btn-icon btn-axis-z" id="flipZ">🪞 Z</button>
            <button class="btn-icon btn-warning" id="resetRot">⟳ Reset</button>
        </div>
        <div class="separator"></div>
        <div class="slider-item">
            <div class="slider-label"><span>🔍 Scale</span><span id="scaleVal">1.00×</span></div>
            <div class="slider-track"><div class="slider-fill" id="scaleFill" style="width:31%"></div><input type="range" id="scaleSlider" min="0.2" max="3" step="0.01" value="1"></div>
        </div>
        <div class="slider-item">
            <div class="slider-label"><span>💡 Ánh sáng</span><span id="lightVal">70%</span></div>
            <div class="slider-track"><div class="slider-fill" id="lightFill" style="width:70%"></div><input type="range" id="lightSlider" min="0" max="100" value="70"></div>
        </div>
        <div class="info-badge"><span>Parts</span><span class="badge-val" id="partsCount">0</span></div>
    </div>
</div>

<div class="upload-area" id="uploadArea">📂 Mở file STEP<input type="file" id="fileInput" accept=".stp,.step" style="display:none"></div>
<div class="file-info" id="fileInfo">📄 <span id="fileName">Chưa có file</span></div>
<div class="status" id="status">✅ Sẵn sàng</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== KHAI BÁO BIẾN =====
let occt = null;
let mainGroup = null;
let allMeshes = [];
let wireframe = false;
let currentRotation = new THREE.Euler(0, 0, 0);
let currentScale = 1;
let dragMode = true;
let isDragging = false;
let dragLastX = 0, dragLastY = 0;

// ===== AUTO SAVE =====
let saveTimeout = null;

function autoSaveModelState() {
    if (!mainGroup) return;

    clearTimeout(saveTimeout);

    saveTimeout = setTimeout(() => {
        localStorage.setItem(
            'cnc_model_state',
            JSON.stringify({
                position: [
                    mainGroup.position.x,
                    mainGroup.position.y,
                    mainGroup.position.z
                ],
                rotation: [
                    currentRotation.x,
                    currentRotation.y,
                    currentRotation.z
                ],
                scale: currentScale
            })
        );

        console.log("💾 Auto Saved");

        const status = document.getElementById("status");
        if (status) {
            status.textContent = "💾 Đã lưu";
            setTimeout(() => {
                status.textContent = `✅ ${allMeshes.length} parts`;
            }, 1000);
        }
    }, 300);
}

const colors = [0x3a86ff, 0xf4a261, 0xe76f51, 0x2a9d8f, 0xe9c46a, 0x9c89b8, 0xf08080, 0x70d6ff, 0xffb703];

// ===== INDEXEDDB - LƯU FILE STEP =====
const DB_NAME = 'CNCViewerDB';
const STORE_NAME = 'stepFiles';
const DB_VERSION = 1;

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
    });
}

async function saveFileToIndexedDB(file) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const record = {
                id: 'current_step',
                name: file.name,
                size: file.size,
                type: file.type,
                data: reader.result,
                timestamp: Date.now()
            };
            const request = store.put(record);
            request.onsuccess = () => {
                console.log('✅ File saved to IndexedDB:', file.name);
                resolve();
            };
            request.onerror = () => reject(request.error);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
    });
}

async function loadFileFromIndexedDB() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get('current_step');
        request.onsuccess = () => {
            const record = request.result;
            if (record && record.data) {
                const file = new File([record.data], record.name, { type: record.type || 'application/step' });
                resolve(file);
            } else {
                resolve(null);
            }
        };
        request.onerror = () => reject(request.error);
    });
}

// ===== THREE.JS SETUP =====
const canvas = document.createElement('canvas');
document.body.insertBefore(canvas, document.body.firstChild);
canvas.style.position = 'fixed';
canvas.style.inset = '0';
canvas.style.width = '100%';
canvas.style.height = '100%';

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0e14, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.00012);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 6000);
camera.position.set(500, 420, 700);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.06;
orbitControls.target.set(0, 0, 0);
orbitControls.zoomSpeed = 1.2;
orbitControls.panSpeed = 0.8;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);
const mainLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
mainLight.position.set(500, 800, 600);
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0x3399ff, 0.4);
fillLight.position.set(-400, -200, -300);
scene.add(fillLight);
const backLight = new THREE.PointLight(0xffaa66, 0.3);
backLight.position.set(0, 200, -500);
scene.add(backLight);

// Helpers
const axesHelper = new THREE.AxesHelper(250);
scene.add(axesHelper);
const gridHelper = new THREE.GridHelper(2200, 60, 0x4a8a9a, 0x2a5a6a);
gridHelper.position.y = -2;
scene.add(gridHelper);

// ===== DRAG MODEL =====
function screenToWorldDelta(dx, dy) {
    const dist = camera.position.distanceTo(mainGroup ? mainGroup.position : orbitControls.target);
    const fovRad = camera.fov * Math.PI / 180;
    const heightAtDist = 2 * Math.tan(fovRad / 2) * dist;
    const pixelToWorld = heightAtDist / window.innerHeight * 1.0;
    return { dx: dx * pixelToWorld, dy: dy * pixelToWorld };
}

canvas.addEventListener('mousedown', (e) => {
    if (!dragMode || !mainGroup) return;
    isDragging = true;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging || !dragMode || !mainGroup) return;
    const { dx, dy } = screenToWorldDelta(e.clientX - dragLastX, e.clientY - dragLastY);
    const right = new THREE.Vector3().crossVectors(camera.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(0, 1, 0)).normalize();
    mainGroup.position.addScaledVector(right, dx);
    mainGroup.position.y -= dy;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    autoSaveModelState();
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    canvas.style.cursor = dragMode ? 'grab' : 'default';
});

function applyRotation() {
    if (!mainGroup) return;
    mainGroup.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z);
    autoSaveModelState();
}

function applyScale() {
    if (!mainGroup) return;
    mainGroup.scale.setScalar(currentScale);
    document.getElementById('scaleFill').style.width = ((currentScale - 0.2) / 2.8) * 100 + '%';
    document.getElementById('scaleVal').innerText = currentScale.toFixed(2) + '×';
    autoSaveModelState();
}

function setDragMode(enabled) {
    dragMode = enabled;
    const dragBtn = document.getElementById('modeDrag');
    const rotBtn = document.getElementById('modeRotate');
    if (dragMode) { 
        dragBtn.classList.add('active'); 
        rotBtn.classList.remove('active'); 
        orbitControls.enabled = false; 
        canvas.style.cursor = 'grab';
    } else { 
        dragBtn.classList.remove('active'); 
        rotBtn.classList.add('active'); 
        orbitControls.enabled = true; 
        canvas.style.cursor = 'default';
    }
}

// ===== UI BINDINGS =====
document.getElementById('modeDrag').onclick = () => setDragMode(true);
document.getElementById('modeRotate').onclick = () => setDragMode(false);

document.getElementById('moveLeft').onclick = () => { if (!mainGroup) return; mainGroup.position.x -= 20; autoSaveModelState(); };
document.getElementById('moveRight').onclick = () => { if (!mainGroup) return; mainGroup.position.x += 20; autoSaveModelState(); };
document.getElementById('moveBack').onclick = () => { if (!mainGroup) return; mainGroup.position.z -= 20; autoSaveModelState(); };
document.getElementById('moveForward').onclick = () => { if (!mainGroup) return; mainGroup.position.z += 20; autoSaveModelState(); };
document.getElementById('moveDown').onclick = () => { if (!mainGroup) return; mainGroup.position.y -= 20; autoSaveModelState(); };
document.getElementById('moveUp').onclick = () => { if (!mainGroup) return; mainGroup.position.y += 20; autoSaveModelState(); };
document.getElementById('resetPos').onclick = () => { if (!mainGroup) return; mainGroup.position.set(0, 0, 0); autoSaveModelState(); showToast('Reset vị trí'); };

document.getElementById('scaleSlider').oninput = (e) => { currentScale = parseFloat(e.target.value); applyScale(); };
document.getElementById('lightSlider').oninput = (e) => { 
    let v = parseInt(e.target.value); 
    ambientLight.intensity = v/100 * 1.5; 
    mainLight.intensity = v/100 * 2.5; 
    document.getElementById('lightFill').style.width = v + '%'; 
    document.getElementById('lightVal').innerText = v + '%'; 
};

document.getElementById('btnWire').onclick = () => { 
    wireframe = !wireframe; 
    allMeshes.forEach(m => { if (m.material) m.material.wireframe = wireframe; }); 
    document.getElementById('btnWire').classList.toggle('active', wireframe); 
    showToast(wireframe ? 'Wireframe ON' : 'Wireframe OFF');
};
document.getElementById('btnGrid').onclick = () => { 
    gridHelper.visible = !gridHelper.visible; 
    document.getElementById('btnGrid').classList.toggle('active', gridHelper.visible); 
};
document.getElementById('btnAxes').onclick = () => { 
    axesHelper.visible = !axesHelper.visible; 
    document.getElementById('btnAxes').classList.toggle('active', axesHelper.visible); 
};
document.getElementById('btnResetCam').onclick = () => { 
    camera.position.set(500, 420, 700); 
    orbitControls.target.set(0, 0, 0); 
    orbitControls.update(); 
    showToast('Reset camera'); 
};

document.getElementById('rotXP').onclick = () => { currentRotation.x += Math.PI/2; applyRotation(); };
document.getElementById('rotXM').onclick = () => { currentRotation.x -= Math.PI/2; applyRotation(); };
document.getElementById('rotYP').onclick = () => { currentRotation.y += Math.PI/2; applyRotation(); };
document.getElementById('rotYM').onclick = () => { currentRotation.y -= Math.PI/2; applyRotation(); };
document.getElementById('rotZP').onclick = () => { currentRotation.z += Math.PI/2; applyRotation(); };
document.getElementById('rotZM').onclick = () => { currentRotation.z -= Math.PI/2; applyRotation(); };
document.getElementById('flipX').onclick = () => { currentRotation.x += Math.PI; applyRotation(); };
document.getElementById('flipY').onclick = () => { currentRotation.y += Math.PI; applyRotation(); };
document.getElementById('flipZ').onclick = () => { currentRotation.z += Math.PI; applyRotation(); };
document.getElementById('resetRot').onclick = () => { currentRotation.set(0, 0, 0); applyRotation(); showToast('Reset xoay'); };

// Panel toggle
let panelCollapsed = false;
document.getElementById('panelToggle').onclick = () => {
    panelCollapsed = true;
    document.getElementById('viewerPanel').classList.add('collapsed');
    document.getElementById('panelReopen').classList.add('visible');
};
document.getElementById('panelReopen').onclick = () => {
    panelCollapsed = false;
    document.getElementById('viewerPanel').classList.remove('collapsed');
    document.getElementById('panelReopen').classList.remove('visible');
};

function showToast(msg) { 
    let t = document.getElementById('toast'); 
    t.textContent = msg; 
    t.classList.add('show'); 
    setTimeout(() => t.classList.remove('show'), 1800); 
}

// ===== XỬ LÝ FILE STEP =====
async function processFile(file, shouldSave = true) {
    const overlay = document.getElementById('overlay');
    const progressFill = document.getElementById('progress-fill');
    const loadMsg = document.getElementById('load-msg');
    overlay.classList.remove('hidden');
    progressFill.style.width = '5%';
    loadMsg.innerHTML = `📄 ${file.name}`;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('status').textContent = '⏳ Đang xử lý...';

    try {
        if (!occt) {
            progressFill.style.width = '15%';
            loadMsg.innerHTML = 'Tải OCCT engine...';
            occt = await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/occt-import-js.js';
                script.onload = () => {
                    window.occtimportjs({ 
                        locateFile: (path) => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/${path}` 
                    }).then(resolve).catch(reject);
                };
                script.onerror = () => reject(new Error('Load OCCT failed'));
                document.head.appendChild(script);
            });
        }
        progressFill.style.width = '35%';
        loadMsg.innerHTML = 'Đọc file STEP...';
        
        const buffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(buffer);
        
        progressFill.style.width = '55%';
        loadMsg.innerHTML = 'Phân tích hình học...';
        let result;
        try {
            result = occt.ReadStepFile(uint8Array, { linearDeflection: 0.1, angularDeflection: 0.5 });
        } catch(e) { 
            result = occt.ReadStepFile(uint8Array); 
        }
        
        if (!result?.meshes?.length) throw new Error('Không có mesh trong file');
        
        progressFill.style.width = '75%';
        loadMsg.innerHTML = 'Dựng mô hình 3D...';
        
        if (mainGroup) scene.remove(mainGroup);
        allMeshes = [];
        mainGroup = new THREE.Group();
        currentRotation.set(0, 0, 0);
        currentScale = 1;
        document.getElementById('scaleSlider').value = 1;
        applyScale();
        
        for (let i = 0; i < result.meshes.length; i++) {
            const m = result.meshes[i];
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(m.attributes.position.array), 3));
            if (m.index && m.index.array) geom.setIndex(new THREE.BufferAttribute(new Uint32Array(m.index.array), 1));
            geom.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], roughness: 0.3, metalness: 0.7 });
            const mesh = new THREE.Mesh(geom, mat);
            mainGroup.add(mesh);
            allMeshes.push(mesh);
        }
        
        scene.add(mainGroup);
        const box = new THREE.Box3().setFromObject(mainGroup);
        const center = box.getCenter(new THREE.Vector3());
        mainGroup.position.sub(center);
        
        // Khôi phục vị trí đã lưu
        loadModelState();
        
        document.getElementById('partsCount').textContent = allMeshes.length;
        progressFill.style.width = '100%';
        loadMsg.innerHTML = `✅ ${allMeshes.length} parts`;
        document.getElementById('status').textContent = `✅ ${allMeshes.length} parts`;
        
        if (shouldSave) {
            await saveFileToIndexedDB(file);
            console.log('✅ File saved to IndexedDB');
        }
        
        setTimeout(() => overlay.classList.add('hidden'), 500);
        showToast(`Đã tải ${allMeshes.length} parts`);
        
    } catch (err) {
        console.error(err);
        progressFill.style.width = '100%';
        loadMsg.innerHTML = `❌ ${err.message}`;
        document.getElementById('status').textContent = '❌ Lỗi';
        setTimeout(() => overlay.classList.add('hidden'), 2500);
    }
}

// ===== TỰ ĐỘNG KHÔI PHỤC =====
async function autoRestoreFile() {
    try {
        const savedFile = await loadFileFromIndexedDB();
        if (savedFile) {
            console.log('🔄 Restoring saved file:', savedFile.name);
            document.getElementById('fileName').textContent = savedFile.name;
            await processFile(savedFile, false);
            showToast(`📂 Đã khôi phục: ${savedFile.name}`);
            return true;
        }
    } catch(e) {
        console.log('No saved file found');
    }
    return false;
}

// ===== UPLOAD HANDLER =====
document.getElementById('uploadArea').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async (e) => {
    if (e.target.files[0]) await processFile(e.target.files[0], true);
};

// Drag & drop
document.body.addEventListener('dragover', (e) => e.preventDefault());
document.body.addEventListener('drop', async (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && /\.(stp|step)$/i.test(file.name)) await processFile(file, true);
});

// ===== LƯU VÀ KHÔI PHỤC TRẠNG THÁI =====
function saveModelState() {
    if (!mainGroup) return;
    localStorage.setItem('cnc_model_state', JSON.stringify({
        position: [mainGroup.position.x, mainGroup.position.y, mainGroup.position.z],
        rotation: [currentRotation.x, currentRotation.y, currentRotation.z],
        scale: currentScale
    }));
    showToast('💾 Đã lưu trạng thái');
}

function loadModelState() {
    const saved = localStorage.getItem('cnc_model_state');
    if (!saved || !mainGroup) return;
    
    const s = JSON.parse(saved);
    mainGroup.position.set(s.position[0], s.position[1], s.position[2]);
    currentRotation.set(s.rotation[0], s.rotation[1], s.rotation[2]);
    currentScale = s.scale || 1;
    document.getElementById('scaleSlider').value = currentScale;
    mainGroup.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z);
    mainGroup.scale.setScalar(currentScale);
    document.getElementById('scaleVal').innerText = currentScale.toFixed(2) + '×';
    document.getElementById('scaleFill').style.width = ((currentScale - 0.2) / 2.8) * 100 + '%';
    console.log("🔄 Model state restored");
}

// postMessage API cho iframe
window.addEventListener('message', (ev) => {
    if (ev.data?.type !== 'cnc_control') return;
    switch (ev.data.action) {
        case 'reset': document.getElementById('resetPos').click(); document.getElementById('resetRot').click(); break;
        case 'wire': document.getElementById('btnWire').click(); break;
        case 'grid': document.getElementById('btnGrid').click(); break;
        case 'axes': document.getElementById('btnAxes').click(); break;
        case 'save': saveModelState(); break;
        case 'load': loadModelState(); break;
    }
});

// ===== ANIMATION =====
function animate() {
    requestAnimationFrame(animate);
    orbitControls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== KHỞI TẠO =====
setDragMode(true);
async function init() {
    try {
        const occtPromise = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/occt-import-js.js';
            script.onload = () => {
                window.occtimportjs({ 
                    locateFile: (path) => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/${path}` 
                }).then(resolve).catch(reject);
            };
            script.onerror = () => reject(new Error('Load OCCT failed'));
            document.head.appendChild(script);
        });
        
        occt = await occtPromise;
        document.getElementById('overlay').classList.add('hidden');
        
        await autoRestoreFile();
        
    } catch(err) {
        console.error(err);
        document.getElementById('load-msg').innerHTML = '❌ Lỗi tải OCCT: ' + err.message;
    }
}
init();
