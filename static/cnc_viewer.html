<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC 3D Viewer</title>
<style>
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        background: #0a0e14;
        font-family: 'SF Pro Display', -apple-system, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
    }

    .viewer-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(10, 14, 20, 0.82);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-radius: 18px;
        border: 1px solid rgba(0, 229, 255, 0.12);
        box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        z-index: 100;
        transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.2s ease;
        width: 228px;
        overflow: hidden;
    }

    .viewer-panel:hover {
        box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 24px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,229,255,0.18), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .viewer-panel.collapsed {
        opacity: 0;
        pointer-events: none;
        transform: translateX(20px);
    }

    .panel-reopen {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        background: rgba(10, 14, 20, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 229, 255, 0.25);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        z-index: 101;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.8);
        transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.2s ease, background 0.2s ease;
        color: #00e5ff;
    }

    .panel-reopen.visible {
        opacity: 1;
        pointer-events: all;
        transform: scale(1);
    }

    .panel-reopen:hover {
        background: rgba(0, 229, 255, 0.12);
        border-color: rgba(0, 229, 255, 0.5);
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
        transform: scale(1.08);
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        cursor: pointer;
        background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(0,229,255,0.02));
        border-bottom: 1px solid rgba(0, 229, 255, 0.08);
        transition: background 0.2s;
    }

    .panel-header:hover {
        background: linear-gradient(135deg, rgba(0,229,255,0.1), rgba(0,229,255,0.04));
    }

    .panel-title {
        font-size: 11px;
        font-weight: 700;
        color: #00e5ff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .panel-toggle {
        background: none;
        border: none;
        color: rgba(0,229,255,0.5);
        cursor: pointer;
        font-size: 16px;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: background 0.15s, color 0.15s, transform 0.2s;
        flex-shrink: 0;
    }

    .panel-toggle:hover {
        background: rgba(0,229,255,0.15);
        color: #00e5ff;
    }

    .panel-content {
        padding: 12px;
        transition: opacity 0.25s ease, transform 0.25s ease;
        max-height: 520px;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 10px;
    }

    .btn-group:last-child { margin-bottom: 0; }

    .btn-icon {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        color: #9ab8cc;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 9px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.3px;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        -webkit-tap-highlight-color: transparent;
        position: relative;
        overflow: hidden;
    }

    .btn-icon:hover {
        background: rgba(0,229,255,0.12);
        border-color: rgba(0,229,255,0.3);
        color: #00e5ff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(0,229,255,0.15);
    }

    .btn-icon:active { transform: translateY(0px) scale(0.97); box-shadow: none; }

    .btn-icon.active {
        background: rgba(0,229,255,0.15);
        border-color: rgba(0,229,255,0.4);
        color: #00e5ff;
        box-shadow: 0 0 12px rgba(0,229,255,0.2), inset 0 0 8px rgba(0,229,255,0.1);
    }

    .btn-mode-drag { background: rgba(255, 107, 0, 0.15); border-color: rgba(255, 107, 0, 0.3); color: #ff8c40; }
    .btn-mode-drag.active { background: rgba(255, 107, 0, 0.25); border-color: rgba(255, 107, 0, 0.6); color: #ff6b00; box-shadow: 0 0 12px rgba(255,107,0,0.2); }
    .btn-mode-rotate.active { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.4); color: #00e5ff; box-shadow: 0 0 12px rgba(0,229,255,0.2); }

    .btn-axis-x { color: #ff7777; border-color: rgba(255,119,119,0.15); }
    .btn-axis-x:hover { background: rgba(255,119,119,0.12); border-color: rgba(255,119,119,0.4); color: #ff9999; }
    .btn-axis-y { color: #7799ff; border-color: rgba(119,153,255,0.15); }
    .btn-axis-y:hover { background: rgba(119,153,255,0.12); border-color: rgba(119,153,255,0.4); color: #aabbff; }
    .btn-axis-z { color: #77ee88; border-color: rgba(119,238,136,0.15); }
    .btn-axis-z:hover { background: rgba(119,238,136,0.12); border-color: rgba(119,238,136,0.4); color: #aaffbb; }

    .btn-danger { background: rgba(231, 76, 60, 0.1); border-color: rgba(231,76,60,0.2); color: #ff8877; }
    .btn-danger:hover { background: rgba(231,76,60,0.2); border-color: rgba(231,76,60,0.5); color: #ff6655; box-shadow: 0 4px 12px rgba(231,76,60,0.2); }

    .btn-warning { background: rgba(243, 156, 18, 0.1); border-color: rgba(243,156,18,0.2); color: #ffcc66; }
    .btn-warning:hover { background: rgba(243,156,18,0.2); border-color: rgba(243,156,18,0.5); color: #ffbb33; box-shadow: 0 4px 12px rgba(243,156,18,0.2); }

    .separator { height: 1px; background: linear-gradient(90deg, transparent, rgba(0,229,255,0.15), transparent); margin: 10px 0; }

    .section-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255, 170, 102, 0.7); margin: 6px 0 5px 0; }

    .slider-item { margin: 8px 0; }
    .slider-label { display: flex; justify-content: space-between; font-size: 10px; color: rgba(138, 174, 192, 0.8); margin-bottom: 5px; letter-spacing: 0.2px; }
    .slider-label span:last-child { color: #00e5ff; font-weight: 600; }
    .slider-track { position: relative; height: 4px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: visible; }
    .slider-fill { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, #0099bb, #00e5ff); border-radius: 10px; pointer-events: none; transition: width 0.05s; }
    input[type="range"] { position: absolute; inset: -6px 0; width: 100%; height: calc(100% + 12px); opacity: 0; cursor: pointer; margin: 0; }

    .info-badge { background: rgba(0,0,0,0.3); border: 1px solid rgba(0,229,255,0.08); border-radius: 10px; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: rgba(107, 143, 168, 0.8); margin-top: 6px; }
    .info-badge .badge-val { color: #00e5ff; font-weight: 700; font-size: 12px; }

    /* ── Auto-load badge ── */
    .autoload-badge {
        background: rgba(0,229,255,0.07);
        border: 1px solid rgba(0,229,255,0.15);
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 10px;
        color: rgba(138,174,192,0.85);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 7px;
        line-height: 1.4;
    }
    .autoload-badge .al-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #00e5ff;
        flex-shrink: 0;
        box-shadow: 0 0 6px #00e5ff;
        animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .upload-area { position: fixed; bottom: 20px; right: 20px; background: rgba(10, 14, 20, 0.88); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 40px; padding: 10px 22px; cursor: pointer; z-index: 100; font-size: 12px; font-weight: 600; color: #00e5ff; transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
    .upload-area:hover { border-color: rgba(0,229,255,0.6); background: rgba(0,229,255,0.08); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,255,0.2); }

    .file-info { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); padding: 7px 16px; border-radius: 30px; font-size: 10.5px; z-index: 100; border-left: 2px solid #00e5ff; color: rgba(184, 212, 232, 0.9); letter-spacing: 0.2px; }
    .status { position: fixed; bottom: 64px; left: 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); padding: 4px 12px; border-radius: 20px; font-size: 9.5px; color: rgba(107, 143, 168, 0.8); font-family: 'SF Mono', 'Fira Code', monospace; pointer-events: none; letter-spacing: 0.3px; }

    #overlay { position: fixed; inset: 0; background: #0a0e14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 200; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring { position: relative; width: 48px; height: 48px; }
    .spinner-ring::before, .spinner-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
    .spinner-ring::before { border-top-color: #00e5ff; border-right-color: rgba(0,229,255,0.3); animation: spinA 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .spinner-ring::after { border-bottom-color: rgba(255, 107, 0, 0.7); border-left-color: rgba(255,107,0,0.2); animation: spinB 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse; inset: 6px; }
    @keyframes spinA { to { transform: rotate(360deg); } }
    @keyframes spinB { to { transform: rotate(360deg); } }

    .progress-bar { width: 220px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00e5ff, #ff6b00); border-radius: 10px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px rgba(0,229,255,0.6); }
    #load-msg { color: rgba(138, 174, 192, 0.8); font-size: 11px; letter-spacing: 0.3px; }

    .panel-content::-webkit-scrollbar { width: 2px; }
    .panel-content::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); border-radius: 4px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal { background: rgba(10,14,20,0.97); border: 1px solid rgba(0,229,255,0.2); border-radius: 20px; box-shadow: 0 32px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,255,0.08); width: 340px; max-width: calc(100vw - 32px); overflow: hidden; transform: translateY(12px) scale(0.97); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 14px; border-bottom: 1px solid rgba(0,229,255,0.08); background: linear-gradient(135deg, rgba(0,229,255,0.06), transparent); }
    .modal-title { font-size: 13px; font-weight: 700; color: #00e5ff; letter-spacing: 0.8px; }
    .modal-close { background: none; border: none; color: rgba(0,229,255,0.4); font-size: 20px; cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .modal-close:hover { background: rgba(0,229,255,0.12); color: #00e5ff; }
    .modal-body { padding: 14px 16px; }
    .save-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .save-name-input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(0,229,255,0.18); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #c8dde8; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .save-name-input:focus { border-color: rgba(0,229,255,0.45); box-shadow: 0 0 0 3px rgba(0,229,255,0.08); }
    .save-name-input::placeholder { color: rgba(138,174,192,0.4); }
    .btn-save-new { background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.3); border-radius: 10px; color: #00e5ff; font-size: 11px; font-weight: 700; padding: 8px 14px; cursor: pointer; transition: background 0.15s, transform 0.12s, box-shadow 0.15s; white-space: nowrap; font-family: inherit; letter-spacing: 0.3px; }
    .btn-save-new:hover { background: rgba(0,229,255,0.22); box-shadow: 0 0 12px rgba(0,229,255,0.2); transform: translateY(-1px); }
    .btn-save-new:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .slots-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,170,102,0.7); margin-bottom: 8px; }
    .slots-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 2px; }
    .slots-list::-webkit-scrollbar { width: 2px; }
    .slots-list::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 4px; }
    .slot-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; transition: border-color 0.2s, background 0.2s; animation: slotIn 0.25s ease; }
    @keyframes slotIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
    .slot-item:hover { border-color: rgba(0,229,255,0.2); background: rgba(0,229,255,0.04); }
    .slot-icon { font-size: 20px; flex-shrink: 0; width: 32px; height: 32px; background: rgba(0,229,255,0.07); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .slot-info { flex: 1; min-width: 0; }
    .slot-name { font-size: 12px; font-weight: 600; color: #c8dde8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-meta { font-size: 9.5px; color: rgba(107,143,168,0.7); margin-top: 2px; display: flex; gap: 8px; }
    .slot-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .btn-slot { background: none; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; color: #7a9ab0; font-size: 13px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
    .btn-slot-load:hover { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.4); color: #00e5ff; }
    .btn-slot-del:hover { background: rgba(231,76,60,0.15); border-color: rgba(231,76,60,0.4); color: #ff6655; }
    .slots-empty { text-align: center; padding: 24px 0; color: rgba(107,143,168,0.4); font-size: 11px; }
    .slots-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.4; }
    .slots-limit { font-size: 9.5px; color: rgba(107,143,168,0.5); text-align: right; margin-top: 10px; }
    .slots-limit span { color: #00e5ff; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px); background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.3); backdrop-filter: blur(12px); color: #00e5ff; padding: 8px 20px; border-radius: 20px; font-size: 11px; font-weight: 600; pointer-events: none; z-index: 300; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; letter-spacing: 0.5px; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* ===== LOAD STATUS ===== */
    .load-badge {
        margin-top: 8px;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: border-color 1.2s ease, box-shadow 1.2s ease;
    }
    .load-badge.state-light  { border-color: rgba(0,184,148,0.4); }
    .load-badge.state-medium { border-color: rgba(243,156,18,0.4); }
    .load-badge.state-heavy  { border-color: rgba(230,126,34,0.4); }
    .load-badge.state-over   { border-color: rgba(231,76,60,0.6); box-shadow: 0 0 12px rgba(231,76,60,0.2); }

    .load-badge-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .load-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,170,102,0.7); }
    #loadStatus  { font-size: 11px; font-weight: 700; transition: color 1.2s ease; color: #6b8fa8; }

    .load-bar-track {
        height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 10px;
        overflow: hidden;
    }
    .load-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 10px;
        transition: width 1.2s cubic-bezier(0.4,0,0.2,1), background 1.2s ease;
        background: #00b894;
    }

    .load-value {
        text-align: right;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1;
        transition: color 1.2s ease;
        color: #6b8fa8;
        font-family: 'SF Mono', 'Fira Code', monospace;
    }

</style>
</head>
<body>

<div id="overlay">
    <div class="spinner-ring"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="load-msg">Đang khởi tạo...</div>
</div>

<div class="toast" id="toast"></div>
<div class="panel-reopen" id="panelReopen" title="Mở panel điều khiển">🎮</div>

<div class="viewer-panel" id="viewerPanel">
    <div class="panel-header" id="panelHeader">
        <span class="panel-title">CNC VIEWER</span>
        <button class="panel-toggle" id="panelToggle">−</button>
    </div>
    <div class="panel-content">

        <!-- Auto-load info -->
        <div class="autoload-badge">
            <div class="al-dot"></div>
            <span>Tự động tải: <strong id="autoFileName" style="color:#00e5ff;">VIRTUAL_MILLING_CNC.stp</strong></span>
        </div>

        <div class="section-label">Hiển thị</div>
        <div class="btn-group">
            <button class="btn-icon" id="btnWire">WIRE</button>
            <button class="btn-icon" id="btnGrid">GRID</button>
            <button class="btn-icon" id="btnAxes">AXES</button>
            <button class="btn-icon btn-danger" id="btnResetCam">↩ CAM</button>
        </div>

        <div class="separator"></div>

        <div class="section-label">Chế độ</div>
        <div class="btn-group">
            <button class="btn-icon btn-mode-drag active" id="modeDrag">✋ Kéo</button>
            <button class="btn-icon btn-mode-rotate" id="modeRotate">⌛ Xoay</button>
        </div>

        <div class="section-label">Di chuyển</div>
        <div class="btn-group">
            <button class="btn-icon btn-axis-x" id="moveLeft">◀ X-</button>
            <button class="btn-icon btn-axis-x" id="moveRight">X+ ▶</button>
            <button class="btn-icon btn-axis-y" id="moveBack">◀ Y-</button>
            <button class="btn-icon btn-axis-y" id="moveForward">Y+ ▶</button>
            <button class="btn-icon btn-axis-z" id="moveDown">▼ Z-</button>
            <button class="btn-icon btn-axis-z" id="moveUp">Z+ ▲</button>
            <button class="btn-icon btn-warning" id="resetPos">↺ Reset</button>
        </div>

        <div class="separator"></div>

        <div class="section-label">Xoay</div>
        <div class="btn-group">
            <button class="btn-icon btn-axis-x" id="rotXP">X+90°</button>
            <button class="btn-icon btn-axis-x" id="rotXM">X−90°</button>
            <button class="btn-icon btn-axis-y" id="rotYP">Y+90°</button>
            <button class="btn-icon btn-axis-y" id="rotYM">Y−90°</button>
            <button class="btn-icon btn-axis-z" id="rotZP">Z+90°</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =============================================
// CẤU HÌNH: Tên file STP đặt cùng thư mục HTML
// =============================================
const AUTO_LOAD_FILE = 'VIRTUAL_MILLING_CNC.stp';
// =============================================

document.getElementById('autoFileName').textContent = AUTO_LOAD_FILE;

// ===== RENDERER =====
const canvas = document.createElement('canvas');
document.body.insertBefore(canvas, document.body.firstChild);
canvas.style.cssText = 'position:fixed;inset:0;display:block;width:100%;height:100%;';

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0e14, 1);
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.sRGBEncoding;

// ===== SCENE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.00012);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 6000);
camera.position.set(500, 420, 700);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.06;
orbitControls.rotateSpeed = 0.65;
orbitControls.zoomSpeed = 1.1;
orbitControls.panSpeed = 0.8;
orbitControls.target.set(0, 0, 0);
orbitControls.minDistance = 20;
orbitControls.maxDistance = 4000;

// ===== LIGHTING =====
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);
const mainLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
mainLight.position.set(500, 800, 600);
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0x3399ff, 0.4);
fillLight.position.set(-400, -200, -300);
scene.add(fillLight);
const rimLight = new THREE.PointLight(0xff6633, 0.3, 2000);
rimLight.position.set(0, -300, 400);
scene.add(rimLight);

// ===== HELPERS =====
const axesHelper = new THREE.AxesHelper(250);
scene.add(axesHelper);
const gridHelper = new THREE.GridHelper(2200, 60, 0x4a8a9a, 0x2a5a6a);
gridHelper.position.y = -2;
scene.add(gridHelper);

// ===== STATE =====
let mainGroup = null, allMeshes = [], wireframe = false;
let currentRotation = new THREE.Euler(0, 0, 0);
let currentScale = 1, dragMode = true;

const colors = [0x3a86ff,0xf4a261,0xe76f51,0x2a9d8f,0xe9c46a,0x9c89b8,0xf08080,0x70d6ff,0xffb703,0x06d6a0,0xef476f,0xffd166];

// ===== DRAG =====
let isDragging = false, dragLastX = 0, dragLastY = 0;
let dragVelX = 0, dragVelY = 0, dragMomentumX = 0, dragMomentumY = 0;
const DRAG_FRICTION = 0.88, DRAG_SPEED = 1.0;

function screenToWorldDelta(dx, dy) {
    const dist = camera.position.distanceTo(mainGroup ? mainGroup.position : orbitControls.target);
    const h = 2 * Math.tan(camera.fov * Math.PI / 360) * dist;
    const s = h / window.innerHeight * DRAG_SPEED;
    return { dx: dx * s, dy: dy * s };
}

canvas.addEventListener('mousedown', e => {
    if (!dragMode || !mainGroup) return;
    isDragging = true; dragLastX = e.clientX; dragLastY = e.clientY;
    dragMomentumX = 0; dragMomentumY = 0;
    canvas.style.cursor = 'grabbing'; e.preventDefault();
});
window.addEventListener('mousemove', e => {
    if (!isDragging || !dragMode || !mainGroup) return;
    const rawDX = e.clientX - dragLastX, rawDY = e.clientY - dragLastY;
    dragVelX = rawDX; dragVelY = rawDY;
    const { dx, dy } = screenToWorldDelta(rawDX, rawDY);
    const right = new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(0,1,0)).normalize();
    mainGroup.position.addScaledVector(right, dx);
    mainGroup.position.y -= dy;
    dragLastX = e.clientX; dragLastY = e.clientY;
    autoSaveTransform();
});
window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false; dragMomentumX = dragVelX; dragMomentumY = dragVelY;
    canvas.style.cursor = dragMode ? 'grab' : 'default';
});

function applyDragMomentum() {
    if (isDragging || !mainGroup || (Math.abs(dragMomentumX) < 0.01 && Math.abs(dragMomentumY) < 0.01)) return;
    const { dx, dy } = screenToWorldDelta(dragMomentumX, dragMomentumY);
    const right = new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(0,1,0)).normalize();
    mainGroup.position.addScaledVector(right, dx);
    mainGroup.position.y -= dy;
    dragMomentumX *= DRAG_FRICTION; dragMomentumY *= DRAG_FRICTION;
}

// ===== HELPERS =====
function applyRotation() { if (mainGroup) mainGroup.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z, 'XYZ'); autoSaveTransform(); }
function applyScale() {
    if (mainGroup) mainGroup.scale.setScalar(currentScale);
    const pct = ((currentScale - 0.2) / (3 - 0.2)) * 100;
    document.getElementById('scaleFill').style.width = pct + '%';
    document.getElementById('scaleVal').innerText = currentScale.toFixed(2) + '×';
    autoSaveTransform();
}

let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function setDragMode(enabled) {
    dragMode = enabled; dragMomentumX = 0; dragMomentumY = 0;
    document.getElementById('modeDrag').classList.toggle('active', dragMode);
    document.getElementById('modeRotate').classList.toggle('active', !dragMode);
    orbitControls.enabled = !dragMode;
    canvas.style.cursor = dragMode ? 'grab' : 'default';
}

// ===== UI =====
document.getElementById('modeDrag').onclick = () => setDragMode(true);
document.getElementById('modeRotate').onclick = () => setDragMode(false);

const MOVE_STEP = 20;
document.getElementById('moveLeft').onclick    = () => { if(mainGroup){mainGroup.position.x-=MOVE_STEP;autoSaveTransform();} };
document.getElementById('moveRight').onclick   = () => { if(mainGroup){mainGroup.position.x+=MOVE_STEP;autoSaveTransform();} };
document.getElementById('moveBack').onclick    = () => { if(mainGroup){mainGroup.position.z-=MOVE_STEP;autoSaveTransform();} };
document.getElementById('moveForward').onclick = () => { if(mainGroup){mainGroup.position.z+=MOVE_STEP;autoSaveTransform();} };
document.getElementById('moveDown').onclick    = () => { if(mainGroup){mainGroup.position.y-=MOVE_STEP;autoSaveTransform();} };
document.getElementById('moveUp').onclick      = () => { if(mainGroup){mainGroup.position.y+=MOVE_STEP;autoSaveTransform();} };
document.getElementById('resetPos').onclick    = () => { if(mainGroup){mainGroup.position.set(0,0,0);autoSaveTransform();showToast('Đã reset vị trí');} };

document.getElementById('scaleSlider').oninput = e => { currentScale = parseFloat(e.target.value); applyScale(); };
document.getElementById('lightSlider').oninput = e => {
    const v = parseInt(e.target.value);
    ambientLight.intensity = v/100*1.5; mainLight.intensity = v/100*2.5;
    document.getElementById('lightFill').style.width = v+'%';
    document.getElementById('lightVal').innerText = v+'%';
};

document.getElementById('btnWire').onclick = () => {
    wireframe = !wireframe;
    allMeshes.forEach(m => { if(m.material) m.material.wireframe = wireframe; });
    document.getElementById('btnWire').classList.toggle('active', wireframe);
    showToast(wireframe ? 'Wireframe ON' : 'Wireframe OFF');
};
document.getElementById('btnGrid').onclick = () => { gridHelper.visible = !gridHelper.visible; document.getElementById('btnGrid').classList.toggle('active', gridHelper.visible); };
document.getElementById('btnAxes').onclick = () => { axesHelper.visible = !axesHelper.visible; document.getElementById('btnAxes').classList.toggle('active', axesHelper.visible); };
document.getElementById('btnResetCam').onclick = () => {
    const s = camera.position.clone(); const e = new THREE.Vector3(500,420,700); let t = 0;
    function a() { t+=0.06; const ease=1-Math.pow(1-Math.min(t,1),3); camera.position.lerpVectors(s,e,ease); orbitControls.target.lerp(new THREE.Vector3(0,0,0),ease*0.15); orbitControls.update(); if(t<1)requestAnimationFrame(a); else{camera.position.copy(e);orbitControls.target.set(0,0,0);} }
    a(); showToast('Camera reset');
};

const HPI = Math.PI/2;
document.getElementById('rotXP').onclick = () => { currentRotation.x+=HPI; applyRotation(); };
document.getElementById('rotXM').onclick = () => { currentRotation.x-=HPI; applyRotation(); };
document.getElementById('rotYP').onclick = () => { currentRotation.y+=HPI; applyRotation(); };
document.getElementById('rotYM').onclick = () => { currentRotation.y-=HPI; applyRotation(); };
document.getElementById('rotZP').onclick = () => { currentRotation.z+=HPI; applyRotation(); };
document.getElementById('rotZM').onclick = () => { currentRotation.z-=HPI; applyRotation(); };
document.getElementById('flipX').onclick  = () => { currentRotation.x+=Math.PI; applyRotation(); };
document.getElementById('flipY').onclick  = () => { currentRotation.y+=Math.PI; applyRotation(); };
document.getElementById('flipZ').onclick  = () => { currentRotation.z+=Math.PI; applyRotation(); };
document.getElementById('resetRot').onclick = () => { currentRotation.set(0,0,0); applyRotation(); showToast('Đã reset góc xoay'); };

let panelCollapsed = false;
function setPanelCollapsed(v) {
    panelCollapsed = v;
    document.getElementById('viewerPanel').classList.toggle('collapsed', v);
    document.getElementById('panelReopen').classList.toggle('visible', v);
}
document.getElementById('panelToggle').onclick = e => { e.stopPropagation(); setPanelCollapsed(true); };
document.getElementById('panelReopen').onclick = () => setPanelCollapsed(false);

// Upload thủ công
document.getElementById('btnManualUpload').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e => { if(e.target.files[0]) await processFile(e.target.files[0], true); };
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => { e.preventDefault(); const f=e.dataTransfer.files[0]; if(f&&/\.(stp|step)$/i.test(f.name)) processFile(f,true); });

// ===== OCCT =====
let occt = null;
async function loadOCCT() {
    return new Promise((resolve, reject) => {
        if (window.occtimportjs) { window.occtimportjs({ locateFile: p=>`https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/${p}` }).then(resolve).catch(reject); return; }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/occt-import-js.js';
        s.onload = () => window.occtimportjs({ locateFile: p=>`https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/${p}` }).then(resolve).catch(reject);
        s.onerror = () => reject(new Error('Không tải được OCCT'));
        document.head.appendChild(s);
    });
}

function setProgress(pct, msg) {
    document.getElementById('progress-fill').style.width = pct+'%';
    if (msg) document.getElementById('load-msg').innerHTML = msg;
}

async function processFile(file, saveToDb = false) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    setProgress(5, `📄 ${file.name}`);
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('status').textContent = '⏳ Đang xử lý...';

    try {
        if (!occt) { setProgress(15, 'Tải OCCT engine...'); occt = await loadOCCT(); }
        setProgress(35, 'Đọc file STEP...');
        const buffer = await file.arrayBuffer();
        const uint8 = new Uint8Array(buffer);
        setProgress(55, 'Phân tích hình học...');
        let result;
        try { result = occt.ReadStepFile(uint8, { linearDeflection:0.1, angularDeflection:0.5 }); }
        catch { result = occt.ReadStepFile(uint8); }
        if (!result?.meshes?.length) throw new Error('Không có mesh trong file');
        setProgress(75, 'Dựng mô hình 3D...');
        if (mainGroup) { scene.remove(mainGroup); allMeshes.forEach(m=>{m.geometry.dispose();m.material.dispose();}); }
        allMeshes = []; mainGroup = new THREE.Group();
        currentRotation.set(0,0,0); currentScale = 1;
        document.getElementById('scaleSlider').value = 1; applyScale();
        result.meshes.forEach((m, i) => {
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(m.attributes.position.array), 3));
            if (m.index?.array) g.setIndex(new THREE.BufferAttribute(new Uint32Array(m.index.array), 1));
            g.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: colors[i%colors.length], roughness:0.3, metalness:0.7 });
            const mesh = new THREE.Mesh(g, mat);
            mainGroup.add(mesh); allMeshes.push(mesh);
        });
        scene.add(mainGroup);
        const box3 = new THREE.Box3().setFromObject(mainGroup);
        mainGroup.position.sub(box3.getCenter(new THREE.Vector3()));
        restoreTransform();
        snapshotOriginalColors();   // lưu màu gốc để có thể reset load về 0
        document.getElementById('partsCount').textContent = allMeshes.length;
        setProgress(100, `✅ ${allMeshes.length} parts`);
        document.getElementById('status').textContent = `✅ ${allMeshes.length} parts`;
        if (saveToDb) { dbSaveCurrentFile(file).catch(()=>{}); localStorage.removeItem('cnc_transform'); }
        setTimeout(() => overlay.classList.add('hidden'), 600);
        showToast(`Đã tải ${allMeshes.length} parts`);
    } catch (err) {
        setProgress(100, `❌ ${err.message}`);
        document.getElementById('status').textContent = '❌ Lỗi: ' + err.message;
        setTimeout(() => overlay.classList.add('hidden'), 3000);
    }
}

// ===== TRANSFORM AUTO-SAVE =====
let _saveTimer = null;
function autoSaveTransform() {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
        if (!mainGroup) return;
        localStorage.setItem('cnc_transform', JSON.stringify({
            pos: mainGroup.position.toArray(),
            rot: [currentRotation.x, currentRotation.y, currentRotation.z],
            scale: currentScale,
        }));
    }, 400);
}
function restoreTransform() {
    const raw = localStorage.getItem('cnc_transform');
    if (!raw || !mainGroup) return;
    try {
        const s = JSON.parse(raw);
        mainGroup.position.fromArray(s.pos);
        currentRotation.set(s.rot[0], s.rot[1], s.rot[2]);
        currentScale = s.scale ?? 1;
        document.getElementById('scaleSlider').value = currentScale;
        applyRotation(); applyScale();
    } catch {}
}

// ===== INDEXED DB =====
const DB_NAME='CNCViewer', DB_VER=2, STORE='slots', STORE_FILE='currentFile', MAX_SLOTS=5;
function openDB() {
    return new Promise((res,rej) => {
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = e => { const db=e.target.result; if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'}); if(!db.objectStoreNames.contains(STORE_FILE))db.createObjectStore(STORE_FILE,{keyPath:'id'}); };
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(r.error);
    });
}
async function dbGetAll() { const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}); }
async function dbPut(slot) { const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(slot);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}); }
async function dbDelete(id) { const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}); }
async function dbSaveCurrentFile(file) { const db=await openDB(); const buf=await file.arrayBuffer(); return new Promise((res,rej)=>{const tx=db.transaction(STORE_FILE,'readwrite');tx.objectStore(STORE_FILE).put({id:'current',name:file.name,data:buf,ts:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}); }
async function dbLoadCurrentFile() { const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE_FILE,'readonly');const r=tx.objectStore(STORE_FILE).get('current');r.onsuccess=()=>{const x=r.result;if(x)res(new File([x.data],x.name,{type:'application/step'}));else res(null);};r.onerror=()=>rej(r.error);}); }

function meshesToData() {
    if (!mainGroup) return null;
    return { meshData: allMeshes.map(m=>({position:Array.from(m.geometry.attributes.position.array),index:m.geometry.index?Array.from(m.geometry.index.array):null,color:m.material.color.getHex()})), groupPos:mainGroup.position.toArray(), rotation:[currentRotation.x,currentRotation.y,currentRotation.z], scale:currentScale, fileName:document.getElementById('fileName').textContent };
}
function rebuildFromData(data) {
    if (mainGroup){scene.remove(mainGroup);allMeshes.forEach(m=>{m.geometry.dispose();m.material.dispose();}); }
    allMeshes=[]; mainGroup=new THREE.Group();
    data.meshData.forEach(md=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(md.position),3));if(md.index)g.setIndex(new THREE.BufferAttribute(new Uint32Array(md.index),1));g.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:md.color,roughness:0.3,metalness:0.7});const mesh=new THREE.Mesh(g,mat);mainGroup.add(mesh);allMeshes.push(mesh);});
    scene.add(mainGroup);
    mainGroup.position.fromArray(data.groupPos);
    currentRotation.set(...data.rotation); currentScale=data.scale;
    document.getElementById('scaleSlider').value=currentScale;
    document.getElementById('fileName').textContent=data.fileName||'Đã tải từ slot';
    document.getElementById('partsCount').textContent=allMeshes.length;
    document.getElementById('status').textContent=`✅ ${allMeshes.length} parts`;
    applyRotation(); applyScale();
    if(wireframe)allMeshes.forEach(m=>m.material.wireframe=true);
}

function formatDate(ts){const d=new Date(ts);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});}

async function renderSlots() {
    const slots = await dbGetAll(); slots.sort((a,b)=>b.savedAt-a.savedAt);
    const list = document.getElementById('slotsList');
    document.getElementById('slotsUsed').textContent = slots.length;
    document.getElementById('btnSaveSlot').disabled = slots.length>=MAX_SLOTS;
    if (!slots.length){list.innerHTML=`<div class="slots-empty"><div class="slots-empty-icon">📭</div>Chưa có mô hình nào được lưu</div>`;return;}
    list.innerHTML = slots.map(s=>`<div class="slot-item" data-id="${s.id}"><div class="slot-icon">📦</div><div class="slot-info"><div class="slot-name">${s.name}</div><div class="slot-meta"><span>🕐 ${formatDate(s.savedAt)}</span><span>⚙️ ${s.parts} parts</span></div></div><div class="slot-actions"><button class="btn-slot btn-slot-load" data-id="${s.id}" title="Tải">↩</button><button class="btn-slot btn-slot-del" data-id="${s.id}" title="Xoá">🗑</button></div></div>`).join('');
    list.querySelectorAll('.btn-slot-load').forEach(btn=>{btn.onclick=async()=>{const sl=slots.find(s=>s.id===btn.dataset.id);if(!sl)return;rebuildFromData(sl.modelData);closeModal();showToast(`📦 Đã tải "${sl.name}"`);};});
    list.querySelectorAll('.btn-slot-del').forEach(btn=>{btn.onclick=async()=>{await dbDelete(btn.dataset.id);await renderSlots();showToast('🗑 Đã xoá');};});
}

async function saveCurrentSlot() {
    if (!mainGroup){showToast('⚠️ Chưa có mô hình');return;}
    const slots=await dbGetAll(); if(slots.length>=MAX_SLOTS){showToast('⚠️ Đã đầy 5 slot');return;}
    const name=(document.getElementById('saveNameInput').value.trim())||document.getElementById('fileName').textContent||'Mô hình';
    await dbPut({id:'slot_'+Date.now(),name,savedAt:Date.now(),parts:allMeshes.length,modelData:meshesToData()});
    document.getElementById('saveNameInput').value='';
    await renderSlots(); showToast(`💾 Đã lưu "${name}"`);
}

function openModal(){document.getElementById('saveModal').classList.add('open');renderSlots();}
function closeModal(){document.getElementById('saveModal').classList.remove('open');}
document.getElementById('btnOpenSave').onclick=openModal;
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('saveModal').onclick=e=>{if(e.target===document.getElementById('saveModal'))closeModal();};
document.getElementById('btnSaveSlot').onclick=saveCurrentSlot;
document.getElementById('saveNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveCurrentSlot();});

// =============================================
// TÍNH NĂNG ĐỔI MÀU THEO TẢI TRỌNG
// =============================================
let currentLoad = 0;
let _originalColors = [];
let _targetMeshColor = null;   // THREE.Color đích, null = về màu gốc
const _currentMeshColors = []; // màu lerp hiện tại từng mesh
const MESH_LERP_SPEED = 0.018; // nhỏ = chậm hơn (0.01–0.05)

function snapshotOriginalColors() {
    _originalColors = allMeshes.map(m => m.material.color.getHex());
    // Sync current lerp colors với màu gốc
    _currentMeshColors.length = 0;
    allMeshes.forEach(m => _currentMeshColors.push(m.material.color.clone()));
    _targetMeshColor = null;
}

function updateColorByLoad(loadPercent) {
    currentLoad = loadPercent;

    let hex, cssColor, stateClass, label;
    if (loadPercent <= 0) {
        _targetMeshColor = null; // về màu gốc
        document.getElementById('loadBadge').className = 'load-badge';
        document.getElementById('loadStatus').textContent = '— Chưa có dữ liệu';
        document.getElementById('loadStatus').style.color = '#6b8fa8';
        document.getElementById('loadValue').textContent = '—';
        document.getElementById('loadValue').style.color = '#6b8fa8';
        document.getElementById('loadBarFill').style.width = '0%';
        document.getElementById('loadBarFill').style.background = '#6b8fa8';
        ambientLight.intensity = 0.9;
        mainLight.intensity   = 2.0;
        return;
    }

    if (loadPercent < 30) {
        hex = 0x00b894; cssColor = '#00b894'; stateClass = 'state-light';  label = '🟢 Tải nhẹ';
    } else if (loadPercent < 70) {
        hex = 0xf39c12; cssColor = '#f39c12'; stateClass = 'state-medium'; label = '🟡 Tải trung bình';
    } else if (loadPercent < 100) {
        hex = 0xe67e22; cssColor = '#e67e22'; stateClass = 'state-heavy';  label = '🟠 Tải nặng';
    } else {
        hex = 0xe74c3c; cssColor = '#e74c3c'; stateClass = 'state-over';   label = '🔴 QUÁ TẢI';
    }

    // Chỉ đặt màu đích — render loop sẽ lerp dần
    _targetMeshColor = new THREE.Color(hex);

    if (loadPercent >= 90) { ambientLight.intensity = 1.4; mainLight.intensity = 3.0; }
    else                   { ambientLight.intensity = 0.9; mainLight.intensity = 2.0; }

    const badge = document.getElementById('loadBadge');
    badge.className = `load-badge ${stateClass}`;
    document.getElementById('loadStatus').textContent = label;
    document.getElementById('loadStatus').style.color = cssColor;
    document.getElementById('loadValue').textContent = loadPercent.toFixed(1) + '%';
    document.getElementById('loadValue').style.color = cssColor;
    const fill = document.getElementById('loadBarFill');
    fill.style.width = Math.min(loadPercent, 100) + '%';
    fill.style.background = cssColor;
}

// Nhận dữ liệu tải từ bên ngoài (postMessage / iframe)
window.addEventListener('message', ev => {
    if (ev.data?.type === 'update_load') {
        const load = parseFloat(ev.data.load);
        if (!isNaN(load)) updateColorByLoad(load);
    }
    // Các lệnh điều khiển cũ
    if (ev.data?.type !== 'cnc_control') return;
    switch (ev.data.action) {
        case 'reset': document.getElementById('resetPos').click(); document.getElementById('resetRot').click(); break;
        case 'wire':  document.getElementById('btnWire').click(); break;
        case 'grid':  document.getElementById('btnGrid').click(); break;
        case 'axes':  document.getElementById('btnAxes').click(); break;
    }
});

// ===== ANIMATION =====
function animate(time) {
    requestAnimationFrame(animate);
    orbitControls.update();
    applyDragMomentum();

    // Lerp màu mesh chậm rãi về màu đích
    if (allMeshes.length && _currentMeshColors.length === allMeshes.length) {
        allMeshes.forEach((mesh, i) => {
            const target = _targetMeshColor
                ? _targetMeshColor
                : (_originalColors[i] !== undefined ? new THREE.Color(_originalColors[i]) : null);
            if (!target) return;
            _currentMeshColors[i].lerp(target, MESH_LERP_SPEED);
            mesh.material.color.copy(_currentMeshColors[i]);
        });
    }

    renderer.render(scene, camera);
}
animate(0);

const ro=new ResizeObserver(()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
ro.observe(document.body);

// ===== INIT — TỰ ĐỘNG TẢI FILE =====
setDragMode(true);

async function init() {
    try {
        setProgress(10, 'Tải OCCT engine...');
        occt = await loadOCCT();

        // Bước 1: Thử fetch file STP cùng thư mục (ưu tiên cao nhất)
        setProgress(25, `🔍 Tìm ${AUTO_LOAD_FILE}...`);
        let autoFile = null;
        try {
            const response = await fetch(AUTO_LOAD_FILE);
            if (response.ok) {
                const blob = await response.blob();
                autoFile = new File([blob], AUTO_LOAD_FILE, { type: 'application/step' });
                setProgress(40, `✅ Tìm thấy ${AUTO_LOAD_FILE}`);
            }
        } catch (fetchErr) {
            // fetch thất bại → thử từ IndexedDB
        }

        if (autoFile) {
            // Tải file tìm được từ cùng thư mục
            await processFile(autoFile, false);
            showToast(`🚀 Tự động tải ${AUTO_LOAD_FILE}`);
        } else {
            // Bước 2: Fallback → thử khôi phục file đã lưu trong IndexedDB
            setProgress(40, '🔄 Kiểm tra lưu trữ...');
            const savedFile = await dbLoadCurrentFile().catch(() => null);
            if (savedFile) {
                setProgress(55, `🔄 Khôi phục: ${savedFile.name}...`);
                await processFile(savedFile, false);
                showToast(`🔄 Đã khôi phục ${savedFile.name}`);
            } else {
                // Bước 3: Không có gì cả → chờ người dùng upload
                setProgress(100, `⚠️ Không tìm thấy ${AUTO_LOAD_FILE} — hãy đặt file cùng thư mục HTML`);
                document.getElementById('status').textContent = '📂 Chờ file...';
                setTimeout(() => document.getElementById('overlay').classList.add('hidden'), 2500);
            }
        }
    } catch (err) {
        document.getElementById('load-msg').textContent = '❌ Lỗi: ' + err.message;
        document.getElementById('status').textContent = '❌ Lỗi khởi động';
        setTimeout(() => document.getElementById('overlay').classList.add('hidden'), 3000);
    }
}

init();
</script>
